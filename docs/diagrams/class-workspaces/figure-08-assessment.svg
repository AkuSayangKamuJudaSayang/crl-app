Vu Sans,Arial,sans-serif" font-size="17" fill="#223249">Choose S.Y., section</text><text x="150" y="169.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">and learner</text><rect x="32.0" y="204.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="150" y="225.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Press Start; select</text><text x="150" y="246.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">one period</text><polygon points="410,193.0 495.0,230 410,267.0 325.0,230" fill="#fff0b8" stroke="#34465c" stroke-width="2.2"/><text x="410" y="225.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Prior period</text><text x="410" y="246.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">completed?</text><rect x="292.0" y="324.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="410" y="345.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Explain locked period;</text><text x="410" y="366.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">retain class selection</text><circle cx="410" cy="410" r="9.0" fill="white" stroke="#223249" stroke-width="2"/><circle cx="410" cy="410" r="4.0" fill="#223249"/><rect x="552.0" y="439.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="670" y="460.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Connect and view</text><text x="670" y="481.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">the current task</text><rect x="32.0" y="439.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="150" y="460.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Mark oral letter sounds</text><text x="150" y="481.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">and word responses</text><rect x="292.0" y="534.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="410" y="555.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Apply screening rules</text><text x="410" y="576.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">and stopping conditions</text><polygon points="410,618.0 495.0,655 410,692.0 325.0,655" fill="#fff0b8" stroke="#34465c" stroke-width="2.2"/><text x="410" y="650.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Continue</text><text x="410" y="671.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">to passage?</text><rect x="552.0" y="729.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="670" y="750.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Read passage; answer</text><text x="670" y="771.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">six oral questions</text><rect x="32.0" y="759.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="150" y="780.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Manage timer, miscues</text><text x="150" y="801.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">and comprehension</text><rect x="32.0" y="629.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="150" y="650.5" text-anchor=