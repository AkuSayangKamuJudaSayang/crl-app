="#728ba0" stroke-width="2"/><text x="390" y="855.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#263b4d">Persist the class and period</text><text x="390" y="876.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#263b4d">Queue locally when offline</text><rect x="205.0" y="924.0" width="370" height="62" rx="9" fill="white" stroke="#728ba0" stroke-width="2"/><text x="390" y="950.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#263b4d">View, print or export</text><text x="390" y="971.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#263b4d">owned assessment records</text><rect x="262.0" y="320" width="32" height="23" rx="3" fill="white"/><text x="278" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#263b4d">No</text><rect x="399.0" y="401" width="42" height="23" rx="3" fill="white"/><text x="420" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#263b4d">Yes</text></svg>