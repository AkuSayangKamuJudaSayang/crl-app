s,Arial,sans-serif" font-size="17" fill="#223249">Choose year, then section</text><text x="150" y="166.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Use top-left Back</text><rect x="292.0" y="124.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="410" y="145.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Authorize class; load</text><text x="410" y="166.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">only its enrolled roster</text><polygon points="150,218.0 235.0,255 150,292.0 65.0,255" fill="#fff0b8" stroke="#34465c" stroke-width="2.2"/><text x="150" y="250.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Delete</text><text x="150" y="271.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">learner(s)?</text><rect x="292.0" y="229.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="410" y="250.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Add / import learners</text><text x="410" y="271.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Edit year / section menu</text><rect x="552.0" y="324.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="670" y="345.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Validate and save in</text><text x="670" y="366.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">the selected class only</text><rect x="552.0" y="404.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="670" y="425.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Include unassessed</text><text x="670" y="446.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">learners with no results</text><circle cx="670" cy="492" r="9.0" fill="white" stroke="#223249" stroke-width="2"/><circle cx="670" cy="492" r="4.0" fill="#223249"/><rect x="32.0" y="384.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="150" y="405.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Type required phrase;</text><text x="150" y="426.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">explain deletion reason</text><polygon points="410,473.0 495.0,510 410,547.0 325.0,510" fill="#fff0b8" stroke="#34465c" stroke-width="2.2"/><text x="410" y="505.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Valid phrase</text><text x="410" y="526.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">and reason?</text><rect x="32.0" y="484.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="150" y="505.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Explain mismatch;</text><text x="150" y="526.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">keep records unchanged</text><circle cx="150" cy="574" r="9.0" fill="white" stroke="#223249" stroke-width="2"/><circle cx="150" cy="574" r="4.0" fill="#223249"/><rect x="552.0" y="614.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="670" y="635.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Check ownership and</text><text x="670" y="656.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">active assessment</text><rect x="552.0" y="709.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="670" y="730.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Delete enrollment and</text><text x="670" y="751.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">dependent results</text><rect x="292.0" y="809.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="410" y="830.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Clear related stale queue</text><text x="410" y="851.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">work; keep other classes</text><rect x="292.0" y="898.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="410" y="919.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Refresh this class roster</text><text x="410" y="940.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">and enrolled counts</text><circle cx="410" cy="982" r="9.0" fill="white" stroke="#223249" stroke-width="2"/><circle cx="410" cy="982" r="4.0" fill="#223249"/><rect x="262.0" y="222" width="32" height="23" rx="3" fill="white"/><text x="278" y="239" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#223249">No</text><rect x="157.0" y="320" width="42" height="23" rx="3" fill="white"/><text x="178" y="337" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#223249">Yes</text><rect x="262.0" y="478" width="32" height="23" rx="3" fill="white"/><text x="278" y="495" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#223249">No</text><rect x="518.0" y="477" width="42" height="23" rx="3" fill="white"/>