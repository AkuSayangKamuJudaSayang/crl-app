-serif" font-size="17" fill="#223249">Save assessment, remark</text><text x="150" y="170.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">or roster change</text><rect x="292.0" y="128.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="410" y="149.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Persist class identity</text><text x="410" y="170.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">and ordered queue</text><polygon points="410,218.0 495.0,255 410,292.0 325.0,255" fill="#fff0b8" stroke="#34465c" stroke-width="2.2"/><text x="410" y="250.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Internet</text><text x="410" y="271.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">reachable?</text><rect x="32.0" y="229.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="150" y="250.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Show saved-offline</text><text x="150" y="271.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">status; keep pending work</text><circle cx="150" cy="321" r="9.0" fill="white" stroke="#223249" stroke-width="2"/><circle cx="150" cy="321" r="4.0" fill="#223249"/><rect x="552.0" y="332.0" width="236" height="52" rx="9" fill="white" stroke="#34465c" stroke-width="2"/><text x="670" y="353.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">Verify teacher ownership,</text><text x="670" y="374.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223249">class and roster version</text><polygon points="670,423.0 755.0,460 670,497.0 585.0,460" fill="#fff0b8" stroke="#3446