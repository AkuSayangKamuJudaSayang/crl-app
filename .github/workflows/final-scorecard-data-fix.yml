name: Fix final scorecard data loading
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Patch host scorecard query
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/api/assessment/route.js')
          s=p.read_text(encoding='utf-8')
          old='''                include: {\n                  sessionMetrics:\n                    true,\n                  passageMiscues: {'''
          new='''                include: {\n                  sessionMetrics:\n                    true,\n                  letterResults: {\n                    orderBy: { letterIndex: "asc" },\n                  },\n                  wordResults: {\n                    orderBy: { wordIndex: "asc" },\n                  },\n                  comprehensionResults: {\n                    orderBy: { questionIndex: "asc" },\n                  },\n                  passageMiscues: {'''
          if s.count(old) != 1: raise SystemExit(f'host include target count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
        run: |
          set -euo pipefail
          grep -q 'letterResults: {' app/api/assessment/route.js
          grep -q 'wordResults: {' app/api/assessment/route.js
          grep -q 'comprehensionResults: {' app/api/assessment/route.js
          git diff --check
          npm install --package-lock=false
          npm run build
      - name: Commit and remove verifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/assessment/route.js .github/workflows/final-scorecard-data-fix.yml
          git commit -m 'Fix final assessment scorecard data loading'
          git rm .github/workflows/final-scorecard-data-fix.yml
          git commit -m 'Remove temporary scorecard verifier'
          git push
