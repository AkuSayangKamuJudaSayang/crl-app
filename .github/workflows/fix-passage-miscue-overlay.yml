name: Fix passage miscue overlay interaction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch passage miscue interaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = path.read_text(encoding='utf-8')

          # 1) Clicking any passage word must open the same miscue overlay in
          # both normal reading and explicit review mode.
          old = '''                  if (miscueReviewMode) {\n                    setSelectedPassageWord(number);\n                    setMiscueWordIndex(number);\n                    setSelectedMiscueType(existingMiscue?.miscueType || null);\n                    setMisreadWord(existingMiscue?.misreadWord || "");\n                    setMiscueDrawerOpen(false);\n                    return;\n                  }'''
          new = '''                  if (miscueReviewMode) {\n                    setSelectedPassageWord(number);\n                    setMiscueWordIndex(number);\n                    setSelectedMiscueType(existingMiscue?.miscueType || null);\n                    setMisreadWord(existingMiscue?.misreadWord || "");\n                    setMiscueDrawerOpen(true);\n                    return;\n                  }'''
          if text.count(old) == 1:
              text = text.replace(old, new, 1)
          elif 'setMiscueDrawerOpen(true);' not in text:
              raise SystemExit('passage review click handler not found')

          # 2) The review prompt is instructional only; actual miscue choices
          # live in the same overlay opened from the original passage word.
          start_marker = '''                      {miscueReviewMode && !timeUpSelecting && (\n                        <div style={styles.miscueInlinePrompt}>'''
          end_marker = '''                      {!miscueReviewMode && !timeUpSelecting && ('''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('review prompt boundaries not found')

          prompt = '''                      {miscueReviewMode && !timeUpSelecting && (\n                        <div style={styles.miscueInlinePrompt}>\n                          <div style={styles.miscueInlinePromptBadge}>REVIEW</div>\n                          <div style={styles.miscueInlinePromptTitle}>Review passage miscues</div>\n                          <div style={styles.miscueInlinePromptText}>\n                            Review the original passage above and press any word where you observed a miscue. Pressing a word opens the miscue options. Leave every word unchanged when there are no miscues.\n                          </div>\n                          <button\n                            type="button"\n                            style={styles.miscueInlineConfirmButton}\n                            onClick={() =>\n                              void finishPassageReading(\n                                passageSeconds,\n                                passageSeconds >= 120 ? passageWordsRead || 0 : 100\n                              )\n                            }\n                            disabled={busy || passageFinalizingRef.current}\n                          >\n                            Confirm &amp; Continue\n                          </button>\n                        </div>\n                      )}\n\n'''
          text = text[:start] + prompt + text[end:]

          # 3) The source already has the complete miscue styles/state/actions;
          # render the missing overlay itself. Keep it outside the transformed
          # assessment card so position:fixed is viewport-relative and cannot be
          # clipped by the card's overflow:hidden.
          marker = '''        {confirmFinishReading && ('''
          if text.count(marker) != 1:
              raise SystemExit(f'overlay insertion marker count={text.count(marker)}')

          if 'miscueDrawerOpen && selectedPassageWord' not in text:
              overlay = '''        {miscueDrawerOpen && selectedPassageWord && (\n          <div\n            style={styles.miscueOverlay}\n            role="dialog"\n            aria-modal="true"\n            aria-labelledby="passage-miscue-title"\n            onClick={(event) => {\n              if (event.target === event.currentTarget) {\n                setMiscueDrawerOpen(false);\n                setSelectedMiscueType(null);\n                setMisreadWord("");\n              }\n            }}\n          >\n            <div style={styles.miscueDrawer}>\n              <div style={styles.miscueDrawerHeader}>\n                <div>\n                  <div style={styles.miscueDrawerEyebrow}>MISCUE OBSERVATION</div>\n                  <div id="passage-miscue-title" style={styles.miscueDrawerWord}>\n                    {passageText.split(/\\s+/).filter(Boolean)[Number(selectedPassageWord) - 1] || "Selected word"}\n                  </div>\n                  <div style={styles.miscueDrawerHint}>Choose the miscue type observed for this word.</div>\n                </div>\n                <button\n                  type="button"\n                  aria-label="Close miscue options"\n                  style={styles.miscueDrawerClose}\n                  onClick={() => {\n                    setMiscueDrawerOpen(false);\n                    setSelectedMiscueType(null);\n                    setMisreadWord("");\n                  }}\n                >\n                  ×\n                </button>\n              </div>\n\n              <div style={styles.miscueTypeGrid}>\n                {[\n                  ["Insertion", "Added word or sound", "#1766a9", "#dff1ff"],\n                  ["Omission", "Word was skipped", "#b32031", "#ffe5e8"],\n                  ["Substitution", "Another word was said", "#955900", "#fff0d9"],\n                  ["Repetition", "Word was repeated", "#7041a8", "#eee5ff"],\n                  ["SelfCorrection", "Learner corrected the error", "#287447", "#e2f7e9"],\n                ].map(([label, description, color, background]) => (\n                  <button\n                    key={label}\n                    type="button"\n                    style={{\n                      ...styles.miscueTypeButton,\n                      color,\n                      background,\n                      borderColor: color,\n                      ...(selectedMiscueType === label ? styles.miscueTypeButtonSelected : {}),\n                    }}\n                    onClick={() => {\n                      setSelectedMiscueType(label);\n                      if (label !== "Insertion" && label !== "Substitution") {\n                        void recordPassageMiscue(selectedPassageWord, label, "");\n                      }\n                    }}\n                    disabled={recordingMiscue}\n                  >\n                    <span style={styles.miscueTypeText}>\n                      <span style={styles.miscueTypeName}>\n                        {label === "SelfCorrection" ? "Self-Correction" : label}\n                      </span>\n                      <span style={styles.miscueTypeDescription}>{description}</span>\n                    </span>\n                    <span style={{ ...styles.miscueTypeArrow, color }}>→</span>\n                  </button>\n                ))}\n              </div>\n\n              {(selectedMiscueType === "Insertion" || selectedMiscueType === "Substitution") && (\n                <div style={styles.miscueEntryArea}>\n                  <label style={styles.miscueEntryLabel}>What did the learner say?</label>\n                  <p style={styles.miscueEntryPrompt}>Record the added or substituted word/sound before applying this miscue.</p>\n                  <input\n                    type="text"\n                    value={misreadWord}\n                    onChange={(event) => setMisreadWord(event.target.value)}\n                    placeholder={selectedMiscueType === "Insertion" ? "Enter the word/sound added" : "Enter the substituted word"}\n                    style={styles.miscueDrawerInput}\n                    disabled={recordingMiscue}\n                    autoFocus\n                  />\n                  <button\n                    type="button"\n                    style={styles.miscueApplyButton}\n                    onClick={() => void recordPassageMiscue(selectedPassageWord, selectedMiscueType, misreadWord)}\n                    disabled={recordingMiscue || !misreadWord.trim()}\n                  >\n                    Apply Miscue\n                  </button>\n                </div>\n              )}\n\n              {passageMiscues.some((item) => Number(item.wordIndex) === Number(selectedPassageWord) - 1) && (\n                <button\n                  type="button"\n                  style={styles.removeMiscueButton}\n                  onClick={() => void removePassageMiscue()}\n                  disabled={recordingMiscue}\n                >\n                  Remove Miscue\n                </button>\n              )}\n            </div>\n          </div>\n        )}\n\n'''
              text = text.replace(marker, overlay + marker, 1)

          # 4) The same component must work with both managed story passages.
          required = [
              'const PASSAGE_TEXT =',
              'const FIELD_PASSAGE_TEXT =',
              'const passageText =',
              'session?.story_title',
              'miscueDrawerOpen && selectedPassageWord',
              'styles.miscueTypeGrid',
              'recordPassageMiscue(selectedPassageWord, selectedMiscueType, misreadWord)',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'missing invariant: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source invariants
        run: |
          set -euo pipefail
          file='app/teacher/assessment/AssessmentClient.jsx'
          test "$(grep -c 'miscueDrawerOpen && selectedPassageWord' "$file")" -eq 1
          test "$(grep -c 'setMiscueDrawerOpen(true)' "$file")" -ge 2
          test "$(grep -c 'styles.miscueTypeGrid' "$file")" -eq 1
          test "$(grep -c 'recordPassageMiscue(selectedPassageWord, selectedMiscueType, misreadWord)' "$file")" -eq 1
          test "$(grep -c 'const PASSAGE_TEXT =' "$file")" -eq 1
          test "$(grep -c 'const FIELD_PASSAGE_TEXT =' "$file")" -eq 1
          if grep -q 'style={styles.miscueInlineTypeGrid}' "$file"; then exit 1; fi
          if grep -q 'style={styles.miscueInlineTypeButton}' "$file"; then exit 1; fi
          git diff --check

      - name: Production build
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build

      - name: Commit verified patch and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx .github/workflows/fix-passage-miscue-overlay.yml
          git commit -m 'Fix passage miscue overlay interaction'
          git rm .github/workflows/fix-passage-miscue-overlay.yml
          git commit -m 'Remove temporary passage overlay repair workflow'
          git push origin main
