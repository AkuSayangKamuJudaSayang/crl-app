name: Repair word transition loading restraint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified transition restraint patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # Learner transition screen: keep the existing mandatory 2-second
          # transition but make it opaque and explicitly say the app is
          # moving to the next level. The word stage already contains item 1,
          # so the first word is shown immediately after this overlay closes.
          # ------------------------------------------------------------
          learner_path = Path('app/learner/LearnerAssessmentPage.jsx')
          learner = learner_path.read_text(encoding='utf-8')

          learner = replace_once(
              learner,
              '''  const triggerWordPreparation = useCallback(() => {
    if (preparationTimerRef.current) window.clearTimeout(preparationTimerRef.current);
    setShowPreparationOverlay(true);
    preparationTimerRef.current = window.setTimeout(() => {
      preparationTimerRef.current = null;
      setShowPreparationOverlay(false);
    }, 2000);
  }, []);''',
              '''  const triggerWordPreparation = useCallback(() => {
    if (preparationTimerRef.current) {
      window.clearTimeout(preparationTimerRef.current);
    }

    setShowPreparationOverlay(true);
    preparationTimerRef.current = window.setTimeout(() => {
      preparationTimerRef.current = null;
      setShowPreparationOverlay(false);
    }, 2000);
  }, []);''',
              'learner transition timer'
          )

          learner = replace_once(
              learner,
              '''      {showPreparationOverlay && !completed && !ended && (
        <div className="overlay" role="status" aria-live="polite" aria-label="Preparing word assessment">
          <div className="overlay-card preparation-card">
            <div className="preparation-spinner" aria-hidden="true" />
          </div>
        </div>
      )}''',
              '''      {showPreparationOverlay && !completed && !ended && (
        <div className="word-preparation-overlay" role="status" aria-live="assertive" aria-label="Moving to the next level">
          <div className="word-preparation-card">
            <div className="preparation-spinner" aria-hidden="true" />
            <h2 className="word-preparation-title">Moving to the next level...</h2>
            <p className="word-preparation-text">Get ready for word recognition.</p>
          </div>
        </div>
      )}''',
              'learner preparation overlay'
          )

          learner = replace_once(
              learner,
              '''        .preparation-card {
          width: 86px !important;
          height: 86px;
          padding: 0 !important;
          display: grid;
          place-items: center;
          border-radius: 20px !important;
        }
        .preparation-spinner {''',
              '''        .preparation-card {
          width: 86px !important;
          height: 86px;
          padding: 0 !important;
          display: grid;
          place-items: center;
          border-radius: 20px !important;
        }

        .word-preparation-overlay {
          position: fixed;
          inset: 0;
          z-index: 7000;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 18px;
          background: #f2f7fc;
          animation: overlayFade .16s ease-out;
        }

        .word-preparation-card {
          width: min(460px, 92vw);
          padding: 30px 26px;
          border: 1px solid #d3e0eb;
          border-radius: 22px;
          background: linear-gradient(145deg,#f8fbff,#eaf3fa);
          box-shadow: 12px 14px 30px rgba(154,174,195,.32), -8px -8px 18px rgba(255,255,255,.90);
          text-align: center;
          color: #203951;
        }

        .word-preparation-title {
          margin: 16px 0 0;
          color: #183e60;
          font-size: clamp(22px, 5vw, 30px);
          line-height: 1.25;
          font-weight: 950;
        }

        .word-preparation-text {
          margin: 8px 0 0;
          color: #71869a;
          font-size: 14px;
          line-height: 1.55;
          font-weight: 750;
        }

        .preparation-spinner {''',
              'learner preparation styles'
          )
          learner_path.write_text(learner, encoding='utf-8')

          # ------------------------------------------------------------
          # Teacher first-word restraint. The existing disabled mechanism is
          # preserved and extended with a transition-only gate. It is started
          # exactly when the authoritative state moves from the final letter
          # item to word item 1, and lasts just beyond the learner's 2-second
          # mandatory loading screen.
          # ------------------------------------------------------------
          teacher_path = Path('app/teacher/assessment/AssessmentClient.jsx')
          teacher = teacher_path.read_text(encoding='utf-8')

          teacher = replace_once(
              teacher,
              '''  const [
    transitionPending,
    setTransitionPending,
  ] = useState(false);

  const miscueWriteChainsRef =''',
              '''  const [
    transitionPending,
    setTransitionPending,
  ] = useState(false);

  const [
    wordPreparationPending,
    setWordPreparationPending,
  ] = useState(false);

  const wordPreparationTimerRef = useRef(null);

  const startWordPreparationGate = useCallback(() => {
    if (wordPreparationTimerRef.current) {
      window.clearTimeout(wordPreparationTimerRef.current);
    }

    setWordPreparationPending(true);

    // Learner overlay = 2.0s. Keep a small safety margin so the first
    // Correct/Incorrect action cannot fire during the transition tail.
    wordPreparationTimerRef.current = window.setTimeout(() => {
      wordPreparationTimerRef.current = null;
      setWordPreparationPending(false);
    }, 2150);
  }, []);

  const miscueWriteChainsRef =''',
              'teacher word transition gate'
          )

          teacher = replace_once(
              teacher,
              '''            if (serverStage === "word") {
              const serverIndex =
                WORDS.indexOf(serverContent);

              if (serverIndex >= 0) {
                setWordIndex(serverIndex);
              }
            }''',
              '''            if (serverStage === "word") {
              const serverIndex =
                WORDS.indexOf(serverContent);

              if (serverIndex >= 0) {
                if (
                  currentStage === "letter" &&
                  serverIndex === 0
                ) {
                  startWordPreparationGate();
                }

                setWordIndex(serverIndex);
              }
            }''',
              'teacher polling transition gate'
          )

          response_anchor = '''        if (data.session) {
          setSession(data.session);
          setActiveStage(data.session.stage);
        }

        setTransitionPending(false);'''
          response_new = '''        if (data.session) {
          const nextStage = String(data.session.stage || "");
          const nextContent = String(
            data.session.current_content ??
              data.session.currentContent ??
              ""
          );

          if (
            latestActiveStageRef.current === "letter" &&
            nextStage === "word" &&
            WORDS.indexOf(nextContent) === 0
          ) {
            startWordPreparationGate();
          }

          setSession(data.session);
          setActiveStage(data.session.stage);
        }

        setTransitionPending(false);'''
          if teacher.count(response_anchor) != 2:
              raise SystemExit(f'teacher record response anchors: expected 2, found {teacher.count(response_anchor)}')
          teacher = teacher.replace(response_anchor, response_new)

          word_disabled = '''                        disabled={
                          busy ||
                          transitionPending ||
                          answerLockKey ===
                            ("word:" +
                              wordIndex)
                        }'''
          word_disabled_new = '''                        disabled={
                          busy ||
                          transitionPending ||
                          wordPreparationPending ||
                          answerLockKey ===
                            ("word:" +
                              wordIndex)
                        }'''
          if teacher.count(word_disabled) != 2:
              raise SystemExit(f'teacher word answer buttons: expected 2, found {teacher.count(word_disabled)}')
          teacher = teacher.replace(word_disabled, word_disabled_new)

          cleanup_anchor = '''  useEffect(() => {
    return () => {
      if ('''
          cleanup_new = '''  useEffect(() => {
    return () => {
      if (wordPreparationTimerRef.current) {
        window.clearTimeout(wordPreparationTimerRef.current);
        wordPreparationTimerRef.current = null;
      }

      if ('''
          teacher = replace_once(teacher, cleanup_anchor, cleanup_new, 'teacher transition timer cleanup')
          teacher_path.write_text(teacher, encoding='utf-8')

          print('Source patch applied.')
          PY

      - name: Verify source invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          learner = Path('app/learner/LearnerAssessmentPage.jsx').read_text(encoding='utf-8')
          teacher = Path('app/teacher/assessment/AssessmentClient.jsx').read_text(encoding='utf-8')
          checks = {
            'learner opaque transition overlay': 'className="word-preparation-overlay"' in learner and 'background: #f2f7fc' in learner,
            'learner transition message': 'Moving to the next level...' in learner,
            'learner mandatory duration remains 2 seconds': '}, 2000);' in learner,
            'teacher first-word transition state': 'wordPreparationPending' in teacher,
            'both word answer buttons disabled by gate': teacher.count('wordPreparationPending ||') == 2,
            'teacher detects letter-to-first-word transition': 'currentStage === "letter"' in teacher and 'serverIndex === 0' in teacher,
            'teacher response path also gates first word': 'nextStage === "word"' in teacher and 'WORDS.indexOf(nextContent) === 0' in teacher,
          }
          for name, ok in checks.items():
            print(f'{name}: {"PASS" if ok else "FAIL"}')
            if not ok:
              raise SystemExit(name)
          PY
          git diff --check

      - name: Install dependencies and build
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build

      - name: Commit verified patch and remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/learner/LearnerAssessmentPage.jsx app/teacher/assessment/AssessmentClient.jsx
          git commit -m 'Fix word transition loading restraint'
          git rm .github/workflows/fix-passage-miscue-overlay.yml .github/workflows/fix-word-transition-gate-v3.yml .github/workflows/fix-word-transition-gate.yml .github/workflows/fix-word-transition-gate-v2.yml scripts/transition-gate-trigger.txt scripts/transition-gate-trigger-v2.txt scripts/transition-gate-v3-trigger.txt
          git commit -m 'Remove temporary transition repair tooling'
          git push origin main
