name: Repair word transition loading gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified transition gate patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # Learner: make the existing mandatory letter -> word loading
          # opaque and explicitly notify the teacher when it finishes.
          # ------------------------------------------------------------
          p = Path('app/learner/LearnerAssessmentPage.jsx')
          text = p.read_text(encoding='utf-8')

          text = replace_once(
              text,
              'import { getAssessmentState, saveAssessmentState } from "../../lib/assessmentOutbox";\nimport {\n  createAssessmentChannel,\n  closeAssessmentChannel,\n  createAssessmentRealtimeChannel,\n} from "../../lib/assessmentChannel";',
              'import { getAssessmentState, saveAssessmentState } from "../../lib/assessmentOutbox";\nimport {\n  createAssessmentChannel,\n  closeAssessmentChannel,\n  createAssessmentRealtimeChannel,\n  publishLearnerPreparationReady,\n} from "../../lib/assessmentChannel";',
              'learner import preparation-ready publisher'
          )

          old_trigger = '''  const triggerWordPreparation = useCallback(() => {\n    if (preparationTimerRef.current) window.clearTimeout(preparationTimerRef.current);\n    setShowPreparationOverlay(true);\n    preparationTimerRef.current = window.setTimeout(() => {\n      preparationTimerRef.current = null;\n      setShowPreparationOverlay(false);\n    }, 2000);\n  }, []);'''
          new_trigger = '''  const triggerWordPreparation = useCallback(() => {\n    if (preparationTimerRef.current) {\n      window.clearTimeout(preparationTimerRef.current);\n    }\n\n    setShowPreparationOverlay(true);\n\n    preparationTimerRef.current = window.setTimeout(() => {\n      preparationTimerRef.current = null;\n      setShowPreparationOverlay(false);\n\n      const learnerCode = String(localSessionKeyRef.current || "")\n        .replace(/^learner:/i, "")\n        .trim();\n\n      if (learnerCode) {\n        void publishLearnerPreparationReady(\n          learnerCode,\n          sessionRef.current\n        );\n      }\n    }, 2000);\n  }, []);'''
          text = replace_once(text, old_trigger, new_trigger, 'learner preparation completion signal')

          old_overlay = '''      {showPreparationOverlay && !completed && !ended && (\n        <div className="overlay" role="status" aria-live="polite" aria-label="Preparing word assessment">\n          <div className="overlay-card preparation-card">\n            <div className="preparation-spinner" aria-hidden="true" />\n          </div>\n        </div>\n      )}'''
          new_overlay = '''      {showPreparationOverlay && !completed && !ended && (\n        <div className="word-preparation-overlay" role="status" aria-live="assertive" aria-label="Moving to the next level">\n          <div className="word-preparation-card">\n            <div className="preparation-spinner" aria-hidden="true" />\n            <h2 className="word-preparation-title">Moving to the next level...</h2>\n            <p className="word-preparation-text">Get ready for word recognition.</p>\n          </div>\n        </div>\n      )}'''
          text = replace_once(text, old_overlay, new_overlay, 'opaque learner preparation overlay')

          style_marker = '''        .preparation-card {\n          width: 86px !important;\n          height: 86px;\n          padding: 0 !important;\n          display: grid;\n          place-items: center;\n          border-radius: 20px !important;\n        }'''
          prep_styles = '''        .word-preparation-overlay {\n          position: fixed;\n          inset: 0;\n          z-index: 7000;\n          display: flex;\n          align-items: center;\n          justify-content: center;\n          padding: 18px;\n          background: #f2f7fc;\n          backdrop-filter: none;\n          -webkit-backdrop-filter: none;\n          animation: overlayFade .16s ease-out;\n        }\n\n        .word-preparation-card {\n          width: min(460px, 92vw);\n          padding: 30px 26px;\n          border: 1px solid #d3e0eb;\n          border-radius: 22px;\n          background: linear-gradient(145deg,#f8fbff,#eaf3fa);\n          box-shadow: 12px 14px 30px rgba(154,174,195,.32), -8px -8px 18px rgba(255,255,255,.90);\n          text-align: center;\n          color: #203951;\n        }\n\n        .word-preparation-title {\n          margin: 16px 0 0;\n          color: #183e60;\n          font-size: clamp(22px, 5vw, 30px);\n          line-height: 1.25;\n          font-weight: 950;\n        }\n\n        .word-preparation-text {\n          margin: 8px 0 0;\n          color: #71869a;\n          font-size: 14px;\n          line-height: 1.55;\n          font-weight: 750;\n        }\n\n'''
          if text.count(style_marker) != 1:
              raise SystemExit('learner preparation style anchor not found')
          text = text.replace(style_marker, style_marker + '\n\n' + prep_styles.rstrip(), 1)
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # Shared realtime channel: learner can send a one-shot readiness
          # event back to the teacher after the mandatory 2-second loading.
          # ------------------------------------------------------------
          p = Path('lib/assessmentChannel.js')
          text = p.read_text(encoding='utf-8')
          append_fn = '''\n\nconst learnerPreparationPublisherChannels = new Map();\n\nexport async function publishLearnerPreparationReady(code, session = null) {\n  if (typeof window === "undefined" || !code) return false;\n\n  const normalizedCode = String(code).toUpperCase();\n\n  // Same-device fallback for teacher/learner running in separate tabs.\n  try {\n    const channel = createAssessmentChannel(normalizedCode);\n    if (channel) {\n      channel.postMessage({\n        type: "learner_preparation_ready",\n        version: Date.now(),\n        source: "learner",\n        code: normalizedCode,\n        stage: session?.stage || "word",\n        item_index: 0,\n      });\n      channel.close();\n    }\n  } catch {}\n\n  const client = await getSupabaseClient();\n  if (!client) return true;\n\n  let channel = learnerPreparationPublisherChannels.get(normalizedCode);\n\n  if (!channel) {\n    channel = client.channel(getRealtimeTopic(normalizedCode), {\n      config: { broadcast: { self: false } },\n    });\n\n    const subscribed = await new Promise((resolve) => {\n      let settled = false;\n      const finish = (value) => {\n        if (settled) return;\n        settled = true;\n        resolve(value);\n      };\n\n      channel.subscribe((status) => {\n        if (status === "SUBSCRIBED") finish(true);\n        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") finish(false);\n      });\n\n      window.setTimeout(() => finish(false), 5000);\n    });\n\n    if (!subscribed) {\n      try { await client.removeChannel(channel); } catch {}\n      return false;\n    }\n\n    learnerPreparationPublisherChannels.set(normalizedCode, channel);\n  }\n\n  const { error } = await channel.send({\n    type: "broadcast",\n    event: "assessment_state",\n    payload: {\n      version: Date.now(),\n      source: "learner",\n      event: "word_preparation_ready",\n      code: normalizedCode,\n      stage: session?.stage || "word",\n      item_index: 0,\n    },\n  });\n\n  return !error;\n}\n'''
          if 'export async function publishLearnerPreparationReady' in text:
              raise SystemExit('learner preparation realtime publisher already exists')
          text += append_fn
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # Teacher: hold the first Word Recognition item until the learner's
          # mandatory transition overlay has finished. A 4-second safety
          # timeout prevents a permanent deadlock if realtime is unavailable;
          # normal operation clears the gate from the learner-ready event.
          # ------------------------------------------------------------
          p = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = p.read_text(encoding='utf-8')

          state_anchor = '''  const [\n    transitionPending,\n    setTransitionPending,\n  ] = useState(false);\n\n  const miscueWriteChainsRef ='''
          state_new = '''  const [\n    transitionPending,\n    setTransitionPending,\n  ] = useState(false);\n\n  const [\n    wordPreparationPending,\n    setWordPreparationPending,\n  ] = useState(false);\n\n  const wordPreparationTimerRef = useRef(null);\n\n  const startWordPreparationGate = useCallback(() => {\n    if (wordPreparationTimerRef.current) {\n      window.clearTimeout(wordPreparationTimerRef.current);\n    }\n\n    setWordPreparationPending(true);\n\n    wordPreparationTimerRef.current = window.setTimeout(() => {\n      wordPreparationTimerRef.current = null;\n      setWordPreparationPending(false);\n    }, 4000);\n  }, []);\n\n  const miscueWriteChainsRef ='''
          text = replace_once(text, state_anchor, state_new, 'teacher word preparation gate state')

          # Polling path: start the same gate when the authoritative session
          # moves from letter to word item 1.
          fetch_anchor = '''            if (serverStage === "word") {\n              const serverIndex =\n                WORDS.indexOf(serverContent);\n\n              if (serverIndex >= 0) {\n                setWordIndex(serverIndex);\n              }\n            }'''
          fetch_new = '''            if (serverStage === "word") {\n              const serverIndex =\n                WORDS.indexOf(serverContent);\n\n              if (serverIndex >= 0) {\n                if (\n                  currentStage === "letter" &&\n                  serverIndex === 0\n                ) {\n                  startWordPreparationGate();\n                }\n                setWordIndex(serverIndex);\n              }\n            }'''
          text = replace_once(text, fetch_anchor, fetch_new, 'teacher polling transition gate')

          # Final letter response path: polling is intentionally disabled while
          # busy, so also start the gate when recordLetter receives word item 1.
          letter_data_anchor = '''        if (data.session) {\n          setSession(data.session);\n          setActiveStage(data.session.stage);\n        }\n\n        setTransitionPending(false);'''
          letter_data_new = '''        if (data.session) {\n          const nextStage = String(data.session.stage || "");\n          const nextContent = String(\n            data.session.current_content ??\n              data.session.currentContent ??\n              ""\n          );\n\n          if (\n            latestActiveStageRef.current === "letter" &&\n            nextStage === "word" &&\n            WORDS.indexOf(nextContent) === 0\n          ) {\n            startWordPreparationGate();\n          }\n\n          setSession(data.session);\n          setActiveStage(data.session.stage);\n        }\n\n        setTransitionPending(false);'''
          if text.count(letter_data_anchor) != 1:
              raise SystemExit(f'teacher record-letter data anchor expected once, found {text.count(letter_data_anchor)}')
          text = text.replace(letter_data_anchor, letter_data_new, 1)

          # First word buttons stay visually restrained while preparation is pending.
          word_button_disabled = '''                        disabled={\n                          busy ||\n                          transitionPending ||\n                          answerLockKey ===\n                            ("word:" +\n                              wordIndex)\n                        }'''
          word_button_disabled_new = '''                        disabled={\n                          busy ||\n                          transitionPending ||\n                          wordPreparationPending ||\n                          answerLockKey ===\n                            ("word:" +\n                              wordIndex)\n                        }'''
          if text.count(word_button_disabled) != 2:
              raise SystemExit(f'teacher word button disabled pattern expected twice, found {text.count(word_button_disabled)}')
          text = text.replace(word_button_disabled, word_button_disabled_new, 2)

          # Teacher realtime subscriber: clear the gate when the learner says
          # the opaque 2-second loading overlay has completed.
          realtime_anchor = '''      (message) => {\n        if (\n          cancelled ||\n          !message ||\n          message.source !== "teacher" ||\n          !message.session\n        ) {\n          return;\n        }\n\n        applyIncomingSession(\n          {\n            ...message.session,\n            __realtimeVersion: message.version,\n          },\n          "broadcast"\n        );\n      }'''
          realtime_new = '''      (message) => {\n        if (cancelled || !message) {\n          return;\n        }\n\n        if (\n          message.source === "learner" &&\n          message.event === "word_preparation_ready" &&\n          Number(message.item_index) === 0\n        ) {\n          setWordPreparationPending(false);\n          if (wordPreparationTimerRef.current) {\n            window.clearTimeout(wordPreparationTimerRef.current);\n            wordPreparationTimerRef.current = null;\n          }\n          return;\n        }\n\n        if (\n          message.source !== "teacher" ||\n          !message.session\n        ) {\n          return;\n        }\n\n        applyIncomingSession(\n          {\n            ...message.session,\n            __realtimeVersion: message.version,\n          },\n          "broadcast"\n        );\n      }'''
          if text.count(realtime_anchor) != 1:
              raise SystemExit(f'teacher realtime subscriber anchor expected once, found {text.count(realtime_anchor)}')
          text = text.replace(realtime_anchor, realtime_new, 1)

          # Ensure cleanup of the safety timer.
          cleanup_anchor = '''      if (\n        networkProbeTimerRef.current\n      ) {'''
          cleanup_new = '''      if (wordPreparationTimerRef.current) {\n        window.clearTimeout(wordPreparationTimerRef.current);\n        wordPreparationTimerRef.current = null;\n      }\n\n      if (\n        networkProbeTimerRef.current\n      ) {'''
          if text.count(cleanup_anchor) != 1:
              raise SystemExit('teacher cleanup anchor missing')
          text = text.replace(cleanup_anchor, cleanup_new, 1)

          # Verify all requested invariants before writing.
          required = [
              'wordPreparationPending',
              'startWordPreparationGate',
              'message.event === "word_preparation_ready"',
              'wordPreparationPending ||',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing teacher invariant: {marker}')

          p.write_text(text, encoding='utf-8')

          print('Verified transition loading gate patch source changes.')
          PY

      - name: Verify source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          learner = Path('app/learner/LearnerAssessmentPage.jsx').read_text(encoding='utf-8')
          teacher = Path('app/teacher/assessment/AssessmentClient.jsx').read_text(encoding='utf-8')
          channel = Path('lib/assessmentChannel.js').read_text(encoding='utf-8')
          checks = {
            'learner has explicit moving overlay': 'Moving to the next level...' in learner,
            'learner overlay is opaque': 'background: #f2f7fc' in learner and 'className="word-preparation-overlay"' in learner,
            'learner sends readiness': 'publishLearnerPreparationReady' in learner,
            'channel exports readiness publisher': 'export async function publishLearnerPreparationReady' in channel,
            'teacher has word gate': 'wordPreparationPending' in teacher,
            'teacher gates word buttons': teacher.count('wordPreparationPending ||') >= 2,
            'teacher listens for learner readiness': 'word_preparation_ready' in teacher,
          }
          for name, ok in checks.items():
            print(f'{name}: {"PASS" if ok else "FAIL"}')
            if not ok:
              raise SystemExit(name)
          PY
          git diff --check

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Production build
        run: npm run build

      - name: Commit verified repair and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/learner/LearnerAssessmentPage.jsx app/teacher/assessment/AssessmentClient.jsx lib/assessmentChannel.js .github/workflows/fix-word-transition-gate.yml
          git commit -m 'Fix learner word transition loading gate'
          git rm .github/workflows/fix-word-transition-gate.yml
          git commit -m 'Remove temporary word transition gate workflow'
          git push origin main
