name: Recover assessment content runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix assessment content runtime fallback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live content loader defensively
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/api/assessment/route.js')
          text = path.read_text(encoding='utf-8')

          old = '''async function getLiveAssessmentContent(teacherId, assessmentPeriod) {
  const rows = await prisma.assessmentContent.findMany({
    where: { teacherId, assessmentPeriod },
    orderBy: [{ category: "asc" }, { position: "asc" }],
  });
  return {
    letters: rows.filter((row) => row.category === "letters").map((row) => row.content || ""),
    words: rows.filter((row) => row.category === "words").map((row) => row.content || ""),
    stories: rows.filter((row) => row.category === "stories").map((row) => ({
      id: row.id,
      title: row.storyTitle || "Untitled Story",
      description: "Story passage from Manage Assessment.",
      text: row.content || "",
      available: Boolean(String(row.content || "").trim()),
    })),
  };
}'''

          new = '''async function getLiveAssessmentContent(teacherId, assessmentPeriod) {
  try {
    const rows = await prisma.assessmentContent.findMany({
      where: { teacherId, assessmentPeriod },
      orderBy: [{ category: "asc" }, { position: "asc" }],
    });

    return {
      letters: rows
        .filter((row) => row.category === "letters")
        .map((row) => row.content || ""),
      words: rows
        .filter((row) => row.category === "words")
        .map((row) => row.content || ""),
      stories: rows
        .filter((row) => row.category === "stories")
        .map((row) => ({
          id: row.id,
          title: row.storyTitle || "Untitled Story",
          description: "Story passage from Manage Assessment.",
          text: row.content || "",
          available: Boolean(String(row.content || "").trim()),
        })),
    };
  } catch (error) {
    console.error("Assessment live content lookup failed:", {
      teacherId,
      assessmentPeriod,
      error,
    });

    const fallback =
      DEFAULT_CONTENT_FOR_PERIOD[assessmentPeriod] ||
      DEFAULT_CONTENT_FOR_PERIOD.BoSY;

    return {
      letters: Array.isArray(fallback?.letters)
        ? fallback.letters.map((value) => String(value))
        : [],
      words: Array.isArray(fallback?.words)
        ? fallback.words.map((value) => String(value))
        : [],
      stories: Array.isArray(fallback?.stories)
        ? fallback.stories.map((story, index) => ({
            id: Number(story?.id ?? index + 1),
            title: String(story?.title || `Story ${index + 1}`),
            description: "Story passage from the default assessment content.",
            text: String(story?.text || ""),
            available: Boolean(String(story?.text || "").trim()),
          }))
        : [],
    };
  }
}'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f'getLiveAssessmentContent patch target count was {count}, expected 1'
              )

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Assessment live content lookup failed' app/api/assessment/route.js
          grep -q 'DEFAULT_CONTENT_FOR_PERIOD.BoSY' app/api/assessment/route.js

      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-assessment-content-runtime.yml
          git add app/api/assessment/route.js .github/workflows/fix-assessment-content-runtime.yml
          git commit -m 'Fix assessment content runtime fallback'
          git push