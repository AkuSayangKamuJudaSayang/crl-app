name: One-shot Assessment Sync Fix

on:
  push:
    branches: [main]
    paths:
      - .github/assessment-sync-fix.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded assessment transition fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # 1) Teacher: publish the authoritative final-word response immediately.
          replace_once(
              "app/teacher/assessment/AssessmentClient.jsx",
              '''        if (data.session) {\n          setSession(data.session);\n          setActiveStage(data.session.stage);\n        }\n\n        setTransitionPending(false);''',
              '''        if (data.session) {\n          const nextSession = {\n            ...data.session,\n            connected:\n              data.session.connected ??\n              latestSessionRef.current?.connected ??\n              true,\n          };\n\n          latestSessionRef.current = nextSession;\n          latestActiveStageRef.current = String(\n            nextSession.stage || ""\n          );\n          latestSessionVersionRef.current = Date.now();\n          setSession(nextSession);\n          setActiveStage(nextSession.stage);\n\n          // The final Word Recognition answer advances the server to\n          // story_choice. Publish that exact response immediately so the\n          // learner never remains on Word 10 while the teacher has moved on.\n          publishAssessmentState(assessmentChannelRef.current, {\n            source: "teacher",\n            session: nextSession,\n          });\n          void publishAssessmentRealtimeState(code, nextSession);\n        }\n\n        setTransitionPending(false);'''
          )

          # 2) Learner: never let a stale timestamp suppress a strictly forward stage.\n          replace_once(
              "app/learner/LearnerAssessmentPage.jsx",
              '''  if (incomingUpdatedAt > 0 && priorUpdatedAt > 0 && incomingUpdatedAt < priorUpdatedAt) {\n    return prior;\n  }''',
              '''  if (\n    incomingUpdatedAt > 0 &&\n    priorUpdatedAt > 0 &&\n    incomingUpdatedAt < priorUpdatedAt &&\n    getStageOrder(incomingStage) <= getStageOrder(priorStage)\n  ) {\n    return prior;\n  }'''
          )

          # 3) Learner realtime: same monotonic rule for broadcast packets.\n          replace_once(
              "app/learner/LearnerAssessmentPage.jsx",
              '''          Date.parse(\n            String(\n              incoming.updated_at ||\n                incoming.updatedAt ||\n                ""\n            )\n          ) <\n          Date.parse(\n            String(\n              current.updated_at ||\n                current.updatedAt ||\n                ""\n            )\n          )''',
              '''          Date.parse(\n            String(\n              incoming.updated_at ||\n                incoming.updatedAt ||\n                ""\n            )\n          ) <\n          Date.parse(\n            String(\n              current.updated_at ||\n                current.updatedAt ||\n                ""\n            )\n          ) &&\n          getStageOrder(String(incoming.stage || "waiting")) <=\n          getStageOrder(String(current.stage || "waiting"))'''
          )

          # 4) Learner status: expose the authoritative host version so all\n          #    server/realtime paths carry consistent freshness metadata.\n          replace_once(
              "app/api/assessment/route.js",
              '''        current_content:\n          host.currentContent,\n        story_title:\n          host.storyTitle,\n        learner:''',
              '''        current_content:\n          host.currentContent,\n        story_title:\n          host.storyTitle,\n        updated_at:\n          host.updatedAt,\n        learner:'''
          )
          PY

      - name: Validate diff
        run: git diff --check

      - name: Commit source fix and remove one-shot helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-assessment-sync-fix.yml .github/assessment-sync-fix.trigger
          git add app/teacher/assessment/AssessmentClient.jsx app/learner/LearnerAssessmentPage.jsx app/api/assessment/route.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: synchronize learner after final word"
          git push origin HEAD:main
