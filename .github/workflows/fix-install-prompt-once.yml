name: One-time PWA install prompt fix

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch teacher install prompt
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/components/TeacherOfflineMenu.jsx")
          text = path.read_text(encoding="utf-8")

          if 'from "../../lib/pwaInstall"' not in text:
              marker = 'import { createPortal } from "react-dom";\n'
              if marker not in text:
                  raise SystemExit("TeacherOfflineMenu import marker not found")
              text = text.replace(
                  marker,
                  marker + 'import { getPwaInstallPrompt, subscribePwaInstallPrompt } from "../../lib/pwaInstall";\n',
                  1,
              )

          old_state = 'const [installEvent, setInstallEvent] = useState(null);'
          new_state = 'const [installEvent, setInstallEvent] = useState(() => getPwaInstallPrompt());'
          if old_state in text:
              text = text.replace(old_state, new_state, 1)
          elif new_state not in text:
              raise SystemExit("Teacher installEvent state marker not found")

          old_listener = '''    const onInstallAvailable = (event) => {\n      event.preventDefault();\n      setInstallEvent(event);\n    };\n    window.addEventListener("beforeinstallprompt", onInstallAvailable);\n\n    return () => {\n      cancelled = true;\n      observer?.disconnect();\n      window.removeEventListener("beforeinstallprompt", onInstallAvailable);\n    };'''
          new_listener = '''    const unsubscribeInstallPrompt = subscribePwaInstallPrompt((event) => {\n      setInstallEvent(event);\n    });\n    const existingInstallPrompt = getPwaInstallPrompt();\n    if (existingInstallPrompt) {\n      setInstallEvent(existingInstallPrompt);\n    }\n\n    return () => {\n      cancelled = true;\n      observer?.disconnect();\n      unsubscribeInstallPrompt();\n    };'''
          if old_listener in text:
              text = text.replace(old_listener, new_listener, 1)
          elif 'subscribePwaInstallPrompt' not in text:
              raise SystemExit("Teacher beforeinstallprompt listener block not found")

          old_prompt = '      if (installEvent) {\n        installEvent.prompt();'
          new_prompt = '      const availableInstallEvent = installEvent || getPwaInstallPrompt();\n      if (availableInstallEvent) {\n        availableInstallEvent.prompt();'
          if old_prompt in text:
              text = text.replace(old_prompt, new_prompt, 1)
          elif 'const availableInstallEvent = installEvent || getPwaInstallPrompt();' not in text:
              raise SystemExit("Teacher install prompt call not found")

          text = text.replace(
              'await installEvent.userChoice.catch(() => null);',
              'await availableInstallEvent.userChoice.catch(() => null);',
              1,
          )

          path.write_text(text, encoding="utf-8")

      - name: Bump teacher PWA shell cache
        shell: python
        run: |
          from pathlib import Path
          path = Path("public/sw.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace('const CACHE_NAME = "crla-pwa-v13";', 'const CACHE_NAME = "crla-pwa-v14";', 1)
          path.write_text(text, encoding="utf-8")

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git status --short
          if git diff --quiet; then
            echo "No patch changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/TeacherOfflineMenu.jsx public/sw.js
          git commit -m "fix: reliably trigger teacher pwa install prompt"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          if [ -f .github/workflows/fix-install-prompt-once.yml ]; then
            git rm .github/workflows/fix-install-prompt-once.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove one-time pwa install workflow"
            git push
          fi
