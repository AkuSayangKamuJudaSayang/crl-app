name: Apply Word readiness fix

on:
  push:
    branches:
      - fix/word-ready-unlock-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Word readiness fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/teacher/assessment/AssessmentClient.jsx")
          text = path.read_text(encoding="utf-8")

          old_ref = '''  const wordInitialTransitionGateKeyRef = useRef("");\n  const learnerWordReadyKeysRef = useRef(new Set());'''
          new_ref = '''  const wordInitialTransitionGateKeyRef = useRef("");\n  const learnerWordReadyKeysRef = useRef(new Set());\n  const wordInitialTransitionTimerRef = useRef(null);'''
          if text.count(old_ref) != 1:
              raise SystemExit("Expected Word readiness refs were not found exactly once; refusing to patch.")
          text = text.replace(old_ref, new_ref, 1)

          old_handler = '''      if (currentIsFirstWord && wordInitialTransitionGateKeyRef.current === gateKey) {\n        learnerWordReadyKeysRef.current.delete(gateKey);\n        setWordInitialTransitionPending(false);\n      }'''
          new_handler = '''      if (currentIsFirstWord && wordInitialTransitionGateKeyRef.current === gateKey) {\n        learnerWordReadyKeysRef.current.delete(gateKey);\n        if (wordInitialTransitionTimerRef.current) {\n          window.clearTimeout(wordInitialTransitionTimerRef.current);\n          wordInitialTransitionTimerRef.current = null;\n        }\n        setWordInitialTransitionPending(false);\n      }'''
          if text.count(old_handler) != 1:
              raise SystemExit("Expected Word readiness handler block was not found exactly once; refusing to patch.")
          text = text.replace(old_handler, new_handler, 1)

          old_effect = '''  useEffect(() => {\n    if (activeStage === "word" && wordIndex === 0) {\n      const current = latestSessionRef.current || session;\n      const gateKey = getAssessmentWordGateKey(code, current);\n\n      if (wordInitialTransitionGateKeyRef.current !== gateKey) {\n        wordInitialTransitionGateKeyRef.current = gateKey;\n        setWordInitialTransitionPending(true);\n      }\n\n      if (learnerWordReadyKeysRef.current.has(gateKey)) {\n        learnerWordReadyKeysRef.current.delete(gateKey);\n        setWordInitialTransitionPending(false);\n      }\n\n      return;\n    }\n\n    wordInitialTransitionGateKeyRef.current = "";\n    learnerWordReadyKeysRef.current.clear();\n    setWordInitialTransitionPending(false);\n  }, [activeStage, wordIndex, code, session]);'''
          new_effect = '''  useEffect(() => {\n    if (activeStage === "word" && wordIndex === 0) {\n      const current = latestSessionRef.current || session;\n      const gateKey = getAssessmentWordGateKey(code, current);\n\n      if (wordInitialTransitionGateKeyRef.current !== gateKey) {\n        if (wordInitialTransitionTimerRef.current) {\n          window.clearTimeout(wordInitialTransitionTimerRef.current);\n          wordInitialTransitionTimerRef.current = null;\n        }\n\n        wordInitialTransitionGateKeyRef.current = gateKey;\n        learnerWordReadyKeysRef.current.delete(gateKey);\n        setWordInitialTransitionPending(true);\n\n        // The learner's mandatory Letter -> Word transition overlay lasts\n        // 2 seconds. The learner readiness packet is the primary unlock path.\n        // This guarded local fallback sits just beyond that overlay so a lost\n        // cross-device control packet can never leave the teacher stranded.\n        wordInitialTransitionTimerRef.current = window.setTimeout(() => {\n          wordInitialTransitionTimerRef.current = null;\n\n          if (\n            wordInitialTransitionGateKeyRef.current === gateKey &&\n            latestActiveStageRef.current === "word" &&\n            WORDS.indexOf(\n              String(\n                latestSessionRef.current?.current_content ??\n                  latestSessionRef.current?.currentContent ??\n                  ""\n              ).trim()\n            ) === 0\n          ) {\n            learnerWordReadyKeysRef.current.delete(gateKey);\n            setWordInitialTransitionPending(false);\n          }\n        }, 2300);\n      }\n\n      if (learnerWordReadyKeysRef.current.has(gateKey)) {\n        learnerWordReadyKeysRef.current.delete(gateKey);\n        if (wordInitialTransitionTimerRef.current) {\n          window.clearTimeout(wordInitialTransitionTimerRef.current);\n          wordInitialTransitionTimerRef.current = null;\n        }\n        setWordInitialTransitionPending(false);\n      }\n\n      return;\n    }\n\n    wordInitialTransitionGateKeyRef.current = "";\n    learnerWordReadyKeysRef.current.clear();\n    if (wordInitialTransitionTimerRef.current) {\n      window.clearTimeout(wordInitialTransitionTimerRef.current);\n      wordInitialTransitionTimerRef.current = null;\n    }\n    setWordInitialTransitionPending(false);\n  }, [activeStage, wordIndex, code, session]);'''
          if text.count(old_effect) != 1:
              raise SystemExit("Expected Word readiness gating effect was not found exactly once; refusing to patch.")
          text = text.replace(old_effect, new_effect, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -n "wordInitialTransitionTimerRef" app/teacher/assessment/AssessmentClient.jsx
          grep -n "2300" app/teacher/assessment/AssessmentClient.jsx
          grep -n "word_first_item_ready" app/learner/LearnerAssessmentPage.jsx
          git diff --check

      - name: Build application
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit source patch and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/assessment/AssessmentClient.jsx
          git rm .github/workflows/apply-word-ready-fix.yml
          git commit -m "fix: guarantee Word 1 readiness unlock"
          git push origin HEAD:fix/word-ready-unlock-final
