name: Comprehension Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch comprehension flow
        run: python3 scripts/fix_comprehension_transition.py
      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'setTransitionPending(true)' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'expected_stage: "comprehension"' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'questionIndexRef.current = nextIndex' app/teacher/assessment/AssessmentClient.jsx
          git diff --check
      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build
      - name: Commit verified source and clean up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx scripts/fix_comprehension_transition.py
          git commit -m 'Fix comprehension answer restraint and transition race'
          git rm scripts/fix_comprehension_transition.py .github/workflows/comprehension-repair.yml .github/workflows/fix-comprehension-transition-lock.yml
          git commit -m 'Remove temporary comprehension repair workflows'
          git push