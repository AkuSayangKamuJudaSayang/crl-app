name: Fix Story Choice Sync

on:
  push:
    branches: [main]
    paths:
      - .github/assessment-story-sync.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded learner story sync fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Fix the runtime ReferenceError seen by the learner client.
          replace_once(
              "app/learner/LearnerAssessmentPage.jsx",
              '''  const priorContent =\n    String(\n      prior.current_content ??\n        prior.currentContent ??\n        ""\n    ).trim();\n\n  const incomingUpdatedAt =''',
              '''  const priorContent =\n    String(\n      prior.current_content ??\n        prior.currentContent ??\n        ""\n    ).trim();\n\n  const priorStage = String(prior.stage || "waiting");\n\n  const incomingUpdatedAt ='''
          )

          # Let the learner consume the teacher-managed story list instead of a stale hardcoded list.
          replace_once(
              "app/learner/LearnerAssessmentPage.jsx",
              '''const STORIES = [\n  {\n    id: 1,\n    title: "Para The Parrot",\n    description: "A story about a parrot flying to the market.",\n  },\n  {\n    id: 2,\n    title: "A Day In The Fields",\n    description: "Join the farmers as they work in the terraces.",\n  },\n];\n\n\nconst STAGE_LABELS = {''',
              '''const STORIES = [\n  {\n    id: 1,\n    title: "Para The Parrot",\n    description: "A story about a parrot flying to the market.",\n  },\n  {\n    id: 2,\n    title: "A Day In The Fields",\n    description: "Join the farmers as they work in the terraces.",\n  },\n];\n\nfunction getLearnerStories(session) {\n  const serverStories =\n    Array.isArray(session?.story_choices)\n      ? session.story_choices\n      : Array.isArray(session?.assessment_content?.stories)\n        ? session.assessment_content.stories\n        : null;\n\n  if (!serverStories) {\n    return STORIES;\n  }\n\n  return serverStories\n    .map((story, index) => ({\n      id: Number(story?.id ?? index + 1),\n      title: String(story?.title || `Story ${index + 1}`),\n      description: String(\n        story?.description ||\n          "Story passage from Manage Assessment."\n      ),\n      text: String(story?.text || ""),\n      available: story?.available !== false &&\n        Boolean(String(story?.text || "").trim()),\n    }))\n    .filter((story) => story.title);\n}\n\nconst STAGE_LABELS = {'''
          )

          replace_once(
              "app/learner/LearnerAssessmentPage.jsx",
              '''  const selectedStory =\n    STORIES.find(\n      (story) =>\n        story.title ===\n        session?.story_title\n    ) ||\n    STORIES[0];''',
              '''  const learnerStories = getLearnerStories(session);\n\n  const selectedStory =\n    learnerStories.find(\n      (story) =>\n        story.title ===\n        session?.story_title\n    ) ||\n    learnerStories[0] ||\n    STORIES[0];'''
          )

          replace_once(
              "app/learner/LearnerAssessmentPage.jsx",
              '''                    {STORIES.map(\n                      (story) => (''',
              '''                    {learnerStories.map(\n                      (story) => ('''
          )

          # learner_status must return the same live story content the teacher sees.
          replace_once(
              "app/api/assessment/route.js",
              '''            learnerId: true,\n            linkedAt: true,''',
              '''            learnerId: true,\n            teacherId: true,\n            linkedAt: true,'''
          )

          replace_once(
              "app/api/assessment/route.js",
              '''      const effectiveConnected =\n        connected &&\n        !assessmentCompleted;\n\n      return responseJson({''',
              '''      const effectiveConnected =\n        connected &&\n        !assessmentCompleted;\n\n      const assessmentPeriod =\n        host.assessmentSession?.assessmentPeriod || "BoSY";\n      const liveAssessmentContent =\n        await getLiveAssessmentContent(\n          host.teacherId,\n          assessmentPeriod\n        );\n\n      return responseJson({'''
          )

          replace_once(
              "app/api/assessment/route.js",
              '''        story_title:\n          host.storyTitle,\n        updated_at:\n          host.updatedAt,\n        learner:''',
              '''        story_title:\n          host.storyTitle,\n        updated_at:\n          host.updatedAt,\n        story_choices:\n          liveAssessmentContent.stories,\n        assessment_content:\n          liveAssessmentContent,\n        learner:'''
          )

          # learner_join also returns live story content immediately, avoiding a stale first render.
          replace_once(
              "app/api/assessment/route.js",
              '''      if (!updated) {\n        return responseJson(\n          {\n            error:\n              "This assessment session is no longer available.",\n          },\n          410\n        );\n      }\n\n      return responseJson({''',
              '''      if (!updated) {\n        return responseJson(\n          {\n            error:\n              "This assessment session is no longer available.",\n          },\n          410\n        );\n      }\n\n      const assessmentPeriod =\n        updated.assessmentSession?.assessmentPeriod || "BoSY";\n      const liveAssessmentContent =\n        await getLiveAssessmentContent(\n          updated.teacherId,\n          assessmentPeriod\n        );\n\n      return responseJson({'''
          )

          replace_once(
              "app/api/assessment/route.js",
              '''        story_title:\n          updated.storyTitle,\n        learner:''',
              '''        story_title:\n          updated.storyTitle,\n        story_choices:\n          liveAssessmentContent.stories,\n        assessment_content:\n          liveAssessmentContent,\n        learner:'''
          )
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -n "const priorStage" app/learner/LearnerAssessmentPage.jsx
          grep -n "story_choices" app/api/assessment/route.js app/learner/LearnerAssessmentPage.jsx

      - name: Commit and remove one-shot helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-story-choice-sync.yml .github/assessment-story-sync.trigger
          git add app/learner/LearnerAssessmentPage.jsx app/api/assessment/route.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: sync learner story choices with teacher"
          git push origin HEAD:main
