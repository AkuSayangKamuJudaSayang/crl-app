name: Finalize passage miscue repair v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-passage-miscue-fix.py'
      - 'scripts/apply-passage-miscue-fix.py'
      - '.github/workflows/finalize-passage-miscue-fix-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply final source repair
        run: python scripts/finalize-passage-miscue-fix.py

      - name: Verify source
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/teacher/assessment/AssessmentClient.jsx').read_text(encoding='utf-8')
          checks = {
              'cancel clears selected word': 'setSelectedPassageWord(null);setSelectedMiscueType(null);setReversionSelecting(false);setReversionSourceWord(null);' in text,
              'reversion picker state': 'setReversionSelecting(true);' in text,
              'picker title': 'Select the word the learner reversed' in text,
              'picker click records pair': "void recordPassageMiscue(Number(reversionSourceWord), 'Reversion', '', number);" in text,
              'picker overlay': 'reversionOverlay' in text,
              'no numeric reversion state': 'reversionTargetWord' not in text,
              'no numeric reversion UI': 'Second word position' not in text and 'Enter the other word number' not in text,
          }
          for label, ok in checks.items():
              print(f'{label}: {ok}')
              assert ok, label
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run build

      - name: Commit source and clean repair tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx
          git rm -f scripts/apply-passage-miscue-fix.py scripts/finalize-passage-miscue-fix.py .github/workflows/apply-passage-miscue-fix.yml .github/workflows/finalize-passage-miscue-fix.yml .github/workflows/finalize-passage-miscue-fix-v2.yml
          git commit -m 'Fix passage miscue cancel and reversion selection'
          git push origin HEAD:main
