name: Fix Learner Story Poll

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Apply guarded learner poll fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/assessment/route.js')
          text = path.read_text(encoding='utf-8')

          old = '''                sessionMetrics: {
                  select: {
                    task1Score: true,
                    task2Score: true,
                    comprehensionScore: true,
                    totalMiscues: true,
                    timerSeconds: true,
                    wpm: true,
                  },
                },'''

          new = '''                sessionMetrics: {
                  select: {
                    task1Score: true,
                    task2Score: true,
                    comprehensionScore: true,
                    totalMiscues: true,
                    timerSeconds: true,
                  },
                },'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f'Guarded learner_status patch expected 1 match, found {count}'
              )

          patched = text.replace(old, new, 1)
          if patched == text:
              raise SystemExit('Learner_status patch produced no change')

          path.write_text(patched, encoding='utf-8')
          print('Removed unsupported SessionMetrics.wpm selection from learner_status.')
          PY

      - name: Validate source
        run: |
          test "$(grep -Fc 'wpm: true' app/api/assessment/route.js)" -eq 0
          git diff --check
          git diff -- app/api/assessment/route.js

      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/assessment/route.js
          git rm -f .github/workflows/fix-learner-story-poll.yml
          git diff --cached --check
          git commit -m "fix: restore learner story polling"
          git push origin HEAD:main
