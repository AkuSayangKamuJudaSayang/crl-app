name: CRLA Field Questions and Miscue Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch source
        shell: bash
        run: |
          cat > /tmp/repair.py <<'PY'
          from pathlib import Path
          import re

          teacher_path = Path('app/teacher/assessment/AssessmentClient.jsx')
          learner_path = Path('app/learner/LearnerAssessmentPage.jsx')

          def replace_once(text, pattern, replacement, flags=re.S, required=True):
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if required and count != 1:
                  raise SystemExit(f'Pattern did not match exactly once: {pattern[:160]}')
              return out

          questions_block = '''const STORY_QUESTIONS = {
            para: [
              { index: 0, text: "What must Para look for?" },
              { index: 1, text: "What time or part of the day is it?" },
              { index: 2, text: "What does Para land on?" },
              { index: 3, text: "Who does Para see?" },
              { index: 4, text: "What else is the police officer doing besides directing traffic?" },
              { index: 5, text: "What could the police officer be feeling?" },
            ],
            fields: [
              { index: 0, text: "What is the job of Dulnuwan?" },
              { index: 1, text: "When do Ali and Dina help Dulnuwan and Bugan?" },
              { index: 2, text: "Where do they rest?" },
              { index: 3, text: "Why do they rest?" },
              { index: 4, text: "What kind of weather or day is it?" },
              { index: 5, text: "What does Dulnuwan pick up?" },
            ],
          };

          const QUESTIONS = STORY_QUESTIONS.para;

          function getComprehensionQuestions(session) {
            const title = String(session?.story_title ?? session?.storyTitle ?? "")
              .trim()
              .toLowerCase();
            return title.includes("a day in the fields")
              ? STORY_QUESTIONS.fields
              : STORY_QUESTIONS.para;
          }'''

          def patch_question_source(path, current_questions_name='currentQuestions'):
              text = path.read_text(encoding='utf-8')
              text = replace_once(text, r'const QUESTIONS = \[.*?\n\];', questions_block)
              return text

          teacher = patch_question_source(teacher_path)
          learner = patch_question_source(learner_path)

          # Teacher comprehension is story-aware while retaining the existing lock/transition implementation.
          teacher = replace_once(
              teacher,
              r'  const currentQuestion =\n    QUESTIONS\[\n      questionIndex\n    \];',
              '  const currentQuestions = getComprehensionQuestions(latestSessionRef.current || session);\n\n  const currentQuestion =\n    currentQuestions[\n      questionIndex\n    ];'
          )
          teacher = teacher.replace(
              'QUESTIONS.findIndex((question) => question.text === incomingContent)',
              'getComprehensionQuestions(data.session).findIndex((question) => question.text === incomingContent)',
              1,
          )
          teacher = teacher.replace(
              'QUESTIONS.findIndex(\n                  (question) =>\n                    question.text === serverContent\n                )',
              'getComprehensionQuestions(data.session).findIndex(\n                  (question) =>\n                    question.text === serverContent\n                )',
              1,
          )
          teacher = teacher.replace(
              'const nextSession = {\n            ...(latestSessionRef.current || {}),\n            stage: "comprehension",\n            current_content: QUESTIONS[0].text,\n            currentContent: QUESTIONS[0].text,\n          };',
              'const nextSession = {\n            ...(latestSessionRef.current || {}),\n            stage: "comprehension",\n            current_content: getComprehensionQuestions(latestSessionRef.current || session)[0].text,\n            currentContent: getComprehensionQuestions(latestSessionRef.current || session)[0].text,\n          };',
              1,
          )
          teacher = teacher.replace(
              'currentContent: QUESTIONS[0].text,',
              'currentContent: getComprehensionQuestions(nextSession)[0].text,',
          )

          record_start = teacher.index('  const recordComprehension =')
          record_end = teacher.index('\n  const finalize =', record_start)
          record = teacher[record_start:record_end]
          record = record.replace(
              '    async (isCorrect) => {\n      const currentIndex = questionIndex;',
              '    async (isCorrect) => {\n      const currentQuestions = getComprehensionQuestions(latestSessionRef.current || session);\n      const currentIndex = questionIndex;',
              1,
          )
          record = record.replace('QUESTIONS.length', 'currentQuestions.length')
          record = record.replace('QUESTIONS[nextIndex]', 'currentQuestions[nextIndex]')
          record = record.replace('QUESTIONS[currentIndex]', 'currentQuestions[currentIndex]')
          teacher = teacher[:record_start] + record + teacher[record_end:]
          teacher = teacher.replace(
              '{\n                        QUESTIONS.length\n                      }',
              '{\n                        currentQuestions.length\n                      }',
              1,
          )

          # Learner regression guard and question display become story-aware.
          learner = learner.replace(
              '      const incomingIndex = QUESTIONS.indexOf(incomingContent);\n      const priorIndex = QUESTIONS.indexOf(priorContent);',
              '      const incomingQuestions = getComprehensionQuestions(incoming);\n      const priorQuestions = getComprehensionQuestions(previous);\n      const incomingIndex = incomingQuestions.findIndex((question) => question.text === incomingContent);\n      const priorIndex = priorQuestions.findIndex((question) => question.text === priorContent);',
              1,
          )
          learner = replace_once(
              learner,
              r'  const currentQuestions =\n    Array\.isArray\(\n      selectedStory\?\.questions\n    \) &&\n    selectedStory\.questions\.length\n      \? selectedStory\.questions\n      : QUESTIONS;',
              '  const currentQuestions = getComprehensionQuestions(session);',
          )

          # Add Reversion state without disturbing existing miscue state.
          state_anchor = '  const [selectedMiscueType, setSelectedMiscueType] = useState(null);\n  const [timeUpSelectedWord, setTimeUpSelectedWord] = useState(null);'
          if state_anchor in teacher and 'reversionTargetWord' not in teacher:
              teacher = teacher.replace(
                  state_anchor,
                  '  const [selectedMiscueType, setSelectedMiscueType] = useState(null);\n  const [reversionTargetWord, setReversionTargetWord] = useState("");\n  const [timeUpSelectedWord, setTimeUpSelectedWord] = useState(null);',
                  1,
              )

          # Reversion-aware recording logic.
          m_start = teacher.index('  const recordPassageMiscue =')
          m_end = teacher.index('\n  useEffect(() => {\n    if (activeStage !== "passage")', m_start)
          new_record = '''  const recordPassageMiscue =
    useCallback(
      async (
        selectedWordOverride,
        typeOverride,
        misreadWordOverride,
        reversionTargetOverride
      ) => {
        const selectedNumber = Number(selectedWordOverride ?? selectedPassageWord ?? 0);
        const selectedIndex = selectedNumber - 1;
        if (selectedIndex < 0 || selectedIndex >= 100) return;

        const nextType = String(typeOverride || selectedMiscueType || miscueType || "Substitution");
        const nextMisreadWord = String(misreadWordOverride ?? misreadWord ?? "").trim();

        if ((nextType === "Insertion" || nextType === "Substitution") && !nextMisreadWord) {
          setSelectedMiscueType(nextType);
          return;
        }

        if (nextType === "Reversion") {
          const targetNumber = Number(reversionTargetOverride ?? reversionTargetWord ?? 0);
          const targetIndex = targetNumber - 1;
          if (!Number.isInteger(targetNumber) || targetIndex < 0 || targetIndex >= 100 || targetIndex === selectedIndex) {
            setSelectedMiscueType(nextType);
            return;
          }
          const groupId = [selectedIndex, targetIndex].sort((a, b) => a - b).join("-");
          const first = { wordIndex: selectedIndex, miscueType: "Reversion", misreadWord: "", relatedWordIndex: targetIndex, reversionGroupId: groupId, reversionOrder: 1 };
          const second = { wordIndex: targetIndex, miscueType: "Reversion", misreadWord: "", relatedWordIndex: selectedIndex, reversionGroupId: groupId, reversionOrder: 2 };
          const nextMiscues = [
            ...passageMiscues.filter((item) => Number(item.wordIndex) !== selectedIndex && Number(item.wordIndex) !== targetIndex),
            first,
            second,
          ].sort((a, b) => Number(a.wordIndex) - Number(b.wordIndex));
          setPassageMiscues(nextMiscues);
          setError("");
          setMisreadWord("");
          setMiscueWordIndex(1);
          setMiscueDrawerOpen(false);
          setSelectedPassageWord(null);
          setSelectedMiscueType(null);
          setReversionTargetWord("");
          await persistPassageDraft({ miscues: nextMiscues });
          return;
        }

        const optimistic = { wordIndex: selectedIndex, miscueType: nextType, misreadWord: nextMisreadWord };
        const nextMiscues = [
          ...passageMiscues.filter((item) => Number(item.wordIndex) !== selectedIndex),
          optimistic,
        ];
        setPassageMiscues(nextMiscues);
        setError("");
        setMisreadWord("");
        setMiscueWordIndex(1);
        setMiscueDrawerOpen(false);
        setSelectedPassageWord(null);
        setSelectedMiscueType(null);
        setReversionTargetWord("");
        await persistPassageDraft({ miscues: nextMiscues });
      },
      [selectedPassageWord, selectedMiscueType, miscueType, misreadWord, reversionTargetWord, passageMiscues, persistPassageDraft]
    );
'''
          teacher = teacher[:m_start] + new_record + teacher[m_end:]

          # Remove full Reversion pair together.
          teacher = teacher.replace(
              '        const nextMiscues = passageMiscues.filter(\n          (item) => Number(item.wordIndex) !== selectedIndex\n        );',
              '        const selectedMiscue = passageMiscues.find((item) => Number(item.wordIndex) === selectedIndex);\n        const relatedIndex = selectedMiscue?.miscueType === "Reversion" ? Number(selectedMiscue.relatedWordIndex) : -1;\n        const nextMiscues = passageMiscues.filter((item) => Number(item.wordIndex) !== selectedIndex && Number(item.wordIndex) !== relatedIndex);',
              1,
          )

          # Existing selection loads Reversion partner.
          teacher = teacher.replace(
              'setSelectedMiscueType(existingMiscue?.miscueType || null);\n                    setMisreadWord(existingMiscue?.misreadWord || "");',
              'setSelectedMiscueType(existingMiscue?.miscueType || null);\n                    setReversionTargetWord(existingMiscue?.relatedWordIndex != null ? String(Number(existingMiscue.relatedWordIndex) + 1) : "");\n                    setMisreadWord(existingMiscue?.misreadWord || "");',
          )
          teacher = teacher.replace(
              'setSelectedMiscueType(\n                    existingMiscue?.miscueType ||\n                      null\n                  );\n                  setMisreadWord(',
              'setSelectedMiscueType(\n                    existingMiscue?.miscueType ||\n                      null\n                  );\n                  setReversionTargetWord(existingMiscue?.relatedWordIndex != null ? String(Number(existingMiscue.relatedWordIndex) + 1) : "");\n                  setMisreadWord(',
              1,
          )

          # Visual CRLA markings: glyph above word + underline/strike/double underline.
          marker_anchor = '''            const isSelected =\n              Number(\n                selectedPassageWord\n              ) ===\n              currentNumber + 1;\n\n            return (\n              <button'''
          marker_replacement = '''            const isSelected =\n              Number(\n                selectedPassageWord\n              ) ===\n              currentNumber + 1;\n\n            const markerStyle = annotation?.miscueType === "Omission"\n              ? { textDecoration: "line-through 3px #d12d3f", textDecorationColor: "#d12d3f" }\n              : annotation?.miscueType === "Repetition"\n                ? { textDecoration: "underline double 3px #d12d3f", textUnderlineOffset: "5px", textDecorationColor: "#d12d3f" }\n                : annotation?.miscueType === "Substitution"\n                  ? { textDecoration: "underline 3px #d12d3f", textUnderlineOffset: "5px", textDecorationColor: "#d12d3f" }\n                  : annotation?.miscueType === "SelfCorrection"\n                    ? { textDecoration: "underline 2px #2a9a59", textUnderlineOffset: "4px", textDecorationColor: "#2a9a59" }\n                    : annotation?.miscueType === "Reversion"\n                      ? { textDecoration: "underline 2px #d12d3f", textUnderlineOffset: "4px", textDecorationColor: "#d12d3f" }\n                      : {};\n            const markerGlyph = annotation?.miscueType === "Insertion"\n              ? "⌃"\n              : annotation?.miscueType === "SelfCorrection"\n                ? "✓"\n                : annotation?.miscueType === "Reversion"\n                  ? `${annotation?.reversionOrder || ""} ${Number(annotation?.relatedWordIndex) > currentNumber ? "↷" : "↶"}`.trim()\n                  : "";\n\n            return (\n              <button'''
          if marker_anchor not in teacher:
              raise SystemExit('Passage marking anchor missing')
          teacher = teacher.replace(marker_anchor, marker_replacement, 1)
          teacher = teacher.replace(
              '                  ...styles.passageWord,\n                  ...(annotationColor',
              '                  ...styles.passageWord,\n                  ...markerStyle,\n                  position: "relative",\n                  ...(annotationColor',
              1,
          )
          teacher = teacher.replace(
              '              >\n                {token}\n              </button>',
              '''              >\n                {annotation && markerGlyph && (\n                  <span\n                    aria-hidden="true"\n                    style={{\n                      position: "absolute",\n                      top: "-16px",\n                      left: "50%",\n                      transform: "translateX(-50%)",\n                      color: annotation.miscueType === "SelfCorrection" ? "#2a9a59" : "#d12d3f",\n                      fontSize: annotation.miscueType === "Reversion" ? "12px" : "16px",\n                      lineHeight: 1,\n                      fontWeight: 950,\n                      whiteSpace: "nowrap",\n                      pointerEvents: "none",\n                    }}\n                  >\n                    {markerGlyph}\n                    {(annotation.miscueType === "Insertion" || annotation.miscueType === "Substitution") && annotation.misreadWord ? (\n                      <span style={{ marginLeft: "3px", fontSize: "10px", fontWeight: 900 }}>{annotation.misreadWord}</span>\n                    ) : null}\n                  </span>\n                )}\n                {token}\n              </button>''',
              1,
          )

          # Add Reversion to the overlay options.
          teacher = teacher.replace(
              "['Insertion','Added word or sound','#1766a9','#dff1ff'],['Omission','Word was skipped','#b32031','#ffe5e8'],['Substitution','Another word was said','#955900','#fff0d9'],['Repetition','Word was repeated','#7041a8','#eee5ff'],['SelfCorrection','Learner corrected the error','#287447','#e2f7e9']",
              "['Insertion','Added word or sound','#1766a9','#dff1ff'],['Omission','Word was skipped','#b32031','#ffe5e8'],['Substitution','Another word was said','#955900','#fff0d9'],['Repetition','Word was read more than once','#7041a8','#eee5ff'],['Reversion','Word or group of words not read in order','#9c3f8f','#f2e5f2'],['SelfCorrection','Word read incorrectly at first but immediately corrected','#287447','#e2f7e9']",
              1,
          )
          teacher = teacher.replace(
              "onClick={() => {setSelectedMiscueType(label);if(label!=='Insertion'&&label!=='Substitution')void recordPassageMiscue(selectedPassageWord,label,'');}}",
              "onClick={() => {setSelectedMiscueType(label);if(label==='Reversion'){setReversionTargetWord('');return;}if(label!=='Insertion'&&label!=='Substitution')void recordPassageMiscue(selectedPassageWord,label,'');}}",
              1,
          )
          entry_anchor = '''              {(selectedMiscueType==='Insertion'||selectedMiscueType==='Substitution') && (\n                <div style={styles.miscueEntryArea}>\n                  <label style={styles.miscueEntryLabel}>What did the learner say?</label>\n                  <input type="text" value={misreadWord} onChange={e=>setMisreadWord(e.target.value)} placeholder={selectedMiscueType==='Insertion'?'Enter the word/sound added':'Enter the substituted word'} style={styles.miscueDrawerInput} disabled={recordingMiscue} autoFocus />\n                  <button type="button" style={styles.miscueApplyButton} onClick={() => void recordPassageMiscue(selectedPassageWord,selectedMiscueType,misreadWord)} disabled={recordingMiscue||!misreadWord.trim()}>Apply Miscue</button>\n                </div>\n              )}'''
          entry_replacement = '''              {(selectedMiscueType==='Insertion'||selectedMiscueType==='Substitution') && (\n                <div style={styles.miscueEntryArea}>\n                  <label style={styles.miscueEntryLabel}>What did the learner say?</label>\n                  <input type="text" value={misreadWord} onChange={e=>setMisreadWord(e.target.value)} placeholder={selectedMiscueType==='Insertion'?'Enter the word/sound added':'Enter the substituted word'} style={styles.miscueDrawerInput} disabled={recordingMiscue} autoFocus />\n                  <button type="button" style={styles.miscueApplyButton} onClick={() => void recordPassageMiscue(selectedPassageWord,selectedMiscueType,misreadWord)} disabled={recordingMiscue||!misreadWord.trim()}>Apply Miscue</button>\n                </div>\n              )}\n              {selectedMiscueType==='Reversion' && (\n                <div style={styles.miscueEntryArea}>\n                  <label style={styles.miscueEntryLabel}>Second word position</label>\n                  <input type="number" min="1" max="100" inputMode="numeric" value={reversionTargetWord} onChange={e=>setReversionTargetWord(e.target.value)} placeholder="Enter the other word number" style={styles.miscueDrawerInput} disabled={recordingMiscue} autoFocus />\n                  <div style={{...styles.miscueDrawerHint,marginTop:"6px"}}>Select the second word position. The two words will receive order numbers and a curved reversion arrow.</div>\n                  <button type="button" style={styles.miscueApplyButton} onClick={() => void recordPassageMiscue(selectedPassageWord,'Reversion','',reversionTargetWord)} disabled={recordingMiscue||!reversionTargetWord}>Apply Reversion</button>\n                </div>\n              )}'''
          if entry_anchor not in teacher:
              raise SystemExit('Miscue entry anchor missing')
          teacher = teacher.replace(entry_anchor, entry_replacement, 1)

          # Clear the reversion field whenever the overlay closes.
          teacher = teacher.replace(
              'setMiscueDrawerOpen(false);setSelectedMiscueType(null);setMisreadWord("");',
              'setMiscueDrawerOpen(false);setSelectedMiscueType(null);setReversionTargetWord("");setMisreadWord("");',
          )

          teacher_path.write_text(teacher, encoding='utf-8')
          learner_path.write_text(learner, encoding='utf-8')

          # Assertions.
          teacher = teacher_path.read_text(encoding='utf-8')
          learner = learner_path.read_text(encoding='utf-8')
          required_teacher = [
              'What is the job of Dulnuwan?',
              'When do Ali and Dina help Dulnuwan and Bugan?',
              'Where do they rest?',
              'Why do they rest?',
              'What kind of weather or day is it?',
              'What does Dulnuwan pick up?',
              'getComprehensionQuestions',
              'Reversion',
              'relatedWordIndex',
              'reversionOrder',
              'textDecoration: "underline double',
              'Word or group of words not read in order',
          ]
          required_learner = [
              'What is the job of Dulnuwan?',
              'When do Ali and Dina help Dulnuwan and Bugan?',
              'Where do they rest?',
              'Why do they rest?',
              'What kind of weather or day is it?',
              'What does Dulnuwan pick up?',
              'const currentQuestions = getComprehensionQuestions(session);',
          ]
          for needle in required_teacher:
              if needle not in teacher:
                  raise SystemExit(f'Missing teacher assertion: {needle}')
          for needle in required_learner:
              if needle not in learner:
                  raise SystemExit(f'Missing learner assertion: {needle}')
          if teacher.count('const STORY_QUESTIONS = {') != 1 or learner.count('const STORY_QUESTIONS = {') != 1:
              raise SystemExit('Story question definition count invalid')
          PY
          python /tmp/repair.py

      - name: Verify source
        run: |
          git diff --check
          grep -n "What is the job of Dulnuwan" app/teacher/assessment/AssessmentClient.jsx app/learner/LearnerAssessmentPage.jsx
          grep -n "Reversion\|relatedWordIndex\|reversionOrder\|underline double\|Word or group of words not read in order" app/teacher/assessment/AssessmentClient.jsx
          grep -n "currentQuestions = getComprehensionQuestions(session)" app/learner/LearnerAssessmentPage.jsx

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run build

      - name: Commit verified source and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/assessment/AssessmentClient.jsx app/learner/LearnerAssessmentPage.jsx
          git commit -m "Add field comprehension questions and CRLA miscue markings"
          git push origin main
          git rm .github/workflows/field-questions-miscue-repair.yml
          git commit -m "Remove temporary field questions miscue repair workflow"
          git push origin main
