name: Apply passage miscue interaction repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-passage-miscue-fix.py'
      - '.github/workflows/apply-passage-miscue-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply verified source patch
        run: python scripts/apply-passage-miscue-fix.py

      - name: Verify source no longer asks for a reversion word number
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = p.read_text(encoding='utf-8')
          assert 'reversionTargetWord' not in text
          assert 'setReversionSelecting(true);' in text
          assert 'Select the word the learner reversed' in text
          assert "void recordPassageMiscue(Number(reversionSourceWord), 'Reversion', '', number);" in text
          assert 'setSelectedPassageWord(null);setSelectedMiscueType(null);setReversionSelecting(false);setReversionSourceWord(null);' in text
          print('Source verification passed')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run build

      - name: Commit verified repair and remove temporary tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx
          git rm scripts/apply-passage-miscue-fix.py .github/workflows/apply-passage-miscue-fix.yml
          git commit -m 'Fix passage miscue selection and reversion flow'
          git push origin HEAD:main
