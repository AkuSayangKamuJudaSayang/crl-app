          assert l.count(old) == 1
          l = l.replace(old, new, 1)

          # Learner refresh: stage learner_experience is the only trigger for
          # the experience dialog; zero-score no longer gets the old exit screen.
          marker = '''          const data =\n            await response.json();\n\n          if (\n            !response.ok\n          ) {'''
          insert = '''          const data =\n            await response.json();\n\n          if (\n            !response.ok\n          ) {'''
          assert l.count(marker) >= 1
          # No-op marker kept only as a sanity check; stage logic is inserted later.

          stage_marker = '''          applyIncomingSession(data, "server");\n\n          setError("");'''
          stage_logic = '''          applyIncomingSession(data, "server");\n\n          if (data.stage === "learner_experience" && !data.ended) {\n            setCompleted(false);\n            setZeroScore(false);\n            setConnected(true);\n            setStatusMessage("Please rate your assessment experience.");\n            if (!experienceSubmittedRef.current) {\n              setSelectedExperienceRating(null);\n              setShowExperienceOverlay(true);\n            }\n            setError("");\n            return;\n          }\n\n          if (data.stage === "teacher_review" && !data.ended) {\n            setCompleted(false);\n            setZeroScore(false);\n            setConnected(false);\n            setShowExperienceOverlay(false);\n            setStatusMessage("Your teacher is reviewing the assessment.");\n            if (!experienceSubmittedRef.current) {\n              experienceSubmittedRef.current = true;\n            }\n            if (!resetTimerRef.current) {\n              resetTimerRef.current = window.setTimeout(() => {\n                resetTimerRef.current = null;\n                resetToCodeEntry();\n              }, 2500);\n            }\n            setError("");\n            return;\n          }\n\n          setError("");'''
          assert l.count(stage_marker) == 1
          l = l.replace(stage_marker, stage_logic, 1)

          # Existing terminal block must no longer force zero-score redirect.
          old = '''            if (\n              scoreIsZero ||\n              data.early_termination ===\n                "part1_task1_zero"\n            ) {'''
          new = '''            if (\n              scoreIsZero ||\n              data.early_termination ===\n                "part1_task1_zero"\n            ) {'''
          assert l.count(old) == 1
          # Keep syntax branch intact; new API no longer enters this branch for new sessions.

          # Disable the legacy zero-score effect by turning it into a no-op for
          # backwards-compatibility sessions already carrying the old marker.
          start = l.index('  useEffect(() => {\n    if (!session || !isPart1Task1ZeroSession(session)) {')
          end = l.index('\n  const submitExperienceRating =', start)
          legacy = '''  useEffect(() => {\n    if (!session || !isPart1Task1ZeroSession(session)) {\n      return undefined;\n    }\n\n    if (zeroScoreRedirectingRef.current) {\n      return undefined;\n    }\n\n    zeroScoreRedirectingRef.current = true;\n    setShowExperienceOverlay(false);\n    setSelectedExperienceRating(null);\n    setZeroScore(true);\n    setCompleted(false);\n    setConnected(false);\n    setShowZeroScoreOverlay(false);\n    setStatusMessage("Please wait for your teacher.");\n\n    return undefined;\n  }, [session]);\n'''
          l = l[:start] + legacy + l[end:]

          old = '''          setShowExperienceOverlay(\n            false\n          );\n\n          if (\n            resetTimerRef.current\n          ) {'''
          new = '''          experienceSubmittedRef.current = true;\n          setShowExperienceOverlay(false);\n          setStatusMessage("Thank you! Your teacher is reviewing the assessment.");\n\n          if (\n            resetTimerRef.current\n          ) {'''
          assert l.count(old) == 1
          l = l.replace(old, new, 1)

          # Learner finished/normal completion should no longer require `completed`
          # to display experience; the stage controls it now.
          old = '''      {showExperienceOverlay &&\n        completed &&\n        !zeroScore && ('''
          new = '''      {showExperienceOverlay &&\n        !ended &&\n        !experienceSubmittedRef.current && ('''
          assert l.count(old) == 1
          l = l.replace(old, new, 1)

          learner.write_text(l, encoding='utf-8')

          # ------------------------------------------------------------------
          # API: metrics + final-review lifecycle
          # ------------------------------------------------------------------
          # Include raw task/comprehension rows in host_get.
          old = '''                  sessionMetrics:\n                    true,\n                  passageMiscues: {'''
          new = '''                  sessionMetrics:\n                    true,\n                  letterResults: {\n                    orderBy: { letterIndex: "asc" },\n                  },\n                  wordResults: {\n                    orderBy: { wordIndex: "asc" },\n                  },\n                  comprehensionResults: {\n                    orderBy: { questionIndex: "asc" },\n                  },\n                  passageMiscues: {'''
          assert a.count(old) == 1
          a = a.replace(old, new, 1)

          # Change Task-1-zero termination into the learner experience gate.
          old = '''      const assessment =\n        await tx.assessmentSession.update(\n          {\n            where: {\n              id:\n                assessmentSessionId,\n            },\n            data: {\n              isCompleted:\n                true,\n              overallClassification:\n                scoring.classification,\n            },\n          }\n        );\n\n      await tx.hostSession.update(\n        {\n          where: {\n            id: hostId,\n          },\n          data: {\n            ended: true,\n            stage:\n              "terminated",\n            currentContent:\n              "ZERO_SCORE_PART1_TASK1",\n\n            linkedAt: null,\n          },\n        }\n      );'''
          new = '''      const assessment =\n        await tx.assessmentSession.update(\n          {\n            where: {\n              id:\n                assessmentSessionId,\n            },\n            data: {\n              isCompleted:\n                false,\n              overallClassification:\n                scoring.classification,\n            },\n          }\n        );\n\n      await tx.hostSession.update(\n        {\n          where: {\n            id: hostId,\n          },\n          data: {\n            ended: false,\n            stage:\n              "learner_experience",\n            currentContent:\n              "LEARNER_EXPERIENCE",\n\n            linkedAt: new Date(),\n          },\n        }\n      );'''
          assert a.count(old) == 1
          a = a.replace(old, new, 1)

          # Add experienceRating + wordsRead + raw result arrays + story number to host_get.
          old = '''                  timerSeconds:\n                    host\n                      .assessmentSession\n                      .sessionMetrics\n                      .timerSeconds,\n\n                  wpm:'''
          new = '''                  timerSeconds:\n                    host\n                      .assessmentSession\n                      .sessionMetrics\n                      .timerSeconds,\n\n                  wordsRead:\n                    Math.max(\n                      0,\n                      getPassageWordCount() -\n                        Number(\n                          host\n                            .assessmentSession\n                            .sessionMetrics\n                            .totalMiscues ||\n                            0\n                        )\n                    ),\n\n                  experienceRating:\n                    host\n                      .assessmentSession\n                      .sessionMetrics\n                      .experienceRating,\n\n                  wpm:'''
          assert a.count(old) == 1
          a = a.replace(old, new, 1)

          old = '''                  remarks:\n                    host\n                      .assessmentSession\n                      .sessionMetrics\n                      .remarks || "",\n\n                  passageMiscues:'''
          new = '''                  remarks:\n                    host\n                      .assessmentSession\n                      .sessionMetrics\n                      .remarks || "",\n\n                  storyNumber:\n                    (() => {\n                      const index = liveStoryChoices.findIndex(\n                        (story) =>\n                          String(story?.title || "").trim().toLowerCase() ===\n                          String(host.storyTitle || "").trim().toLowerCase()\n                      );\n                      return index >= 0 ? index + 1 : null;\n                    })(),\n\n                  letterResults:\n                    host\n                      .assessmentSession\n                      .letterResults\n                      ?.map((item) => ({\n                        index: item.letterIndex,\n                        content: item.letter,\n                        isCorrect: item.isCorrect,\n                      })) || [],\n\n                  wordResults:\n                    host\n                      .assessmentSession\n                      .wordResults\n                      ?.map((item) => ({\n                        index: item.wordIndex,\n                        content: item.word,\n                        isCorrect: item.isCorrect,\n                      })) || [],\n\n                  comprehensionResults:\n                    host\n                      .assessmentSession\n                      .comprehensionResults\n                      ?.map((item) => ({\n                        questionIndex: item.questionIndex,\n                        isCorrect: item.isCorrect,\n                      })) || [],\n\n                  passageMiscues:'''
          assert a.count(old) == 1
          a = a.replace(old, new, 1)

          # Add learner rating endpoint before teacher auth.
          marker = '''  /* ======================================================================== */\n  /* TEACHER AUTHENTICATION                                                   */\n  /* ======================================================================== */'''
          endpoint = '''  /* ======================================================================== */\n  /* LEARNER EXPERIENCE RATING                                               */\n  /* ======================================================================== */\n\n  if (action === "save_experience_rating") {\n    const code = normalizeCode(body?.code);\n    const learnerId = Number(body?.learner_id ?? body?.learnerId ?? 0);\n    const rating = Number(body?.experience_rating ?? body?.experienceRating);\n\n    if (!code || !Number.isInteger(rating) || rating < 1 || rating > 5) {\n      return responseJson({ error: "A valid assessment code and experience rating from 1 to 5 are required." }, 400);\n    }\n\n    try {\n      const host = await findHostByCode(code);\n      if (!host || !host.assessmentSessionId || host.ended) {\n        return responseJson({ error: "Assessment session not found or already closed." }, 404);\n      }\n\n      if (learnerId && Number(host.learnerId) !== learnerId) {\n        return responseJson({ error: "Learner does not match this assessment session." }, 403);\n      }\n\n      if (host.stage !== "learner_experience") {\n        return responseJson({ error: "The learner experience rating is not currently being requested." }, 409);\n      }\n\n      const saved = await prisma.$transaction(async (tx) => {\n        const metrics = await tx.sessionMetrics.upsert({\n          where: { sessionId: host.assessmentSessionId },\n          update: { experienceRating: rating },\n          create: {\n            sessionId: host.assessmentSessionId,\n            experienceRating: rating,\n          },\n        });\n\n        const updatedHost = await tx.hostSession.update({\n          where: { id: host.id },\n          data: {\n            ended: false,\n            stage: "teacher_review",\n            currentContent: "TEACHER_REVIEW",\n            linkedAt: host.linkedAt || new Date(),\n          },\n        });\n\n        return { metrics, host: updatedHost };\n      });\n\n      return responseJson({\n        status: "ok",\n        saved: true,\n        experience_rating: saved.metrics.experienceRating,\n        stage: saved.host.stage,\n        current_content: saved.host.currentContent,\n      });\n    } catch (error) {\n      console.error("save_experience_rating error:", error);\n      return responseJson({ error: "Unable to save the learner experience rating." }, 500);\n    }\n  }\n\n  /* ======================================================================== */\n  /* TEACHER AUTHENTICATION                                                   */\n  /* ======================================================================== */'''
          assert a.count(marker) == 1
          a = a.replace(marker, endpoint, 1)

          # Add final teacher review save endpoint immediately before existing FINALIZE.
          marker = '''    /* ====================================================================== */\n    /* FINALIZE                                                                */\n    /* ====================================================================== */'''
          final_endpoint = '''    /* ====================================================================== */\n    /* SAVE FINAL ASSESSMENT REVIEW                                            */\n    /* ====================================================================== */\n\n    if (action === "save_final_assessment_review") {\n      const code = normalizeCode(body?.code);\n      const observationLevel = Number(body?.observation_level ?? body?.observationLevel);\n      const readingProfile = String(body?.reading_profile ?? body?.readingProfile ?? "").trim();\n      const remarks = String(body?.remarks ?? "").trim();\n      const allowedProfiles = [\n        "Low Emerging Reader",\n        "High Emerging Reader",\n        "Developing Reader",\n        "Transitioning Reader",\n        "Reading at Grade Level",\n      ];\n\n      if (!code) return responseJson({ error: "Assessment code is required." }, 400);\n      if (![1, 2, 3, 4].includes(observationLevel)) {\n        return responseJson({ error: "Observation Level must be 1, 2, 3, or 4." }, 400);\n      }\n      if (!allowedProfiles.includes(readingProfile)) {\n        return responseJson({ error: "A valid Reading Profile is required." }, 400);\n      }\n      if (remarks.length > 5000) {\n        return responseJson({ error: "Remarks must be 5,000 characters or fewer." }, 400);\n      }\n\n      const host = await prisma.hostSession.findFirst({\n        where: { code, teacherId: userId },\n        include: {\n          assessmentSession: { include: { sessionMetrics: true } },\n        },\n      });\n\n      if (!host || !host.assessmentSessionId || !host.assessmentSession) {\n        return responseJson({ error: "Assessment session not found." }, 404);\n      }\n\n      if (!["learner_experience", "teacher_review", "completed"].includes(host.stage)) {\n        return responseJson({ error: "The assessment is not ready for final review." }, 409);\n      }\n\n      if (!host.assessmentSession.sessionMetrics?.experienceRating) {\n        return responseJson({ error: "The learner experience rating must be completed before saving the assessment." }, 409);\n      }\n\n      try {\n        const saved = await prisma.$transaction(async (tx) => {\n          const scoring = await calculateMetrics(tx, host.assessmentSessionId);\n          const metrics = await tx.sessionMetrics.upsert({\n            where: { sessionId: host.assessmentSessionId },\n            update: {\n              observationLevel,\n              classificationLabel: readingProfile,\n              remarks,\n              experienceRating: host.assessmentSession.sessionMetrics?.experienceRating ?? null,\n            },\n            create: {\n              sessionId: host.assessmentSessionId,\n              task1Score: scoring.task1Score ?? 0,\n              task2Score: scoring.task2Score ?? 0,\n              totalMiscues: scoring.totalMiscues ?? 0,\n              miscueAccuracy: scoring.miscueAccuracy ?? 0,\n              comprehensionScore: scoring.comprehensionScore ?? 0,\n              timerSeconds: scoring.metrics?.timerSeconds ?? null,\n              observationLevel,\n              classificationLabel: readingProfile,\n              remarks,\n              experienceRating: host.assessmentSession.sessionMetrics?.experienceRating ?? null,\n            },\n          });\n\n          const assessment = await tx.assessmentSession.update({\n            where: { id: host.assessmentSessionId },\n            data: {\n              isCompleted: true,\n              overallClassification: readingProfile,\n            },\n          });\n\n          await tx.hostSession.update({\n            where: { id: host.id },\n            data: {\n              ended: true,\n              stage: "completed",\n              currentContent: "Assessment completed.",\n              linkedAt: new Date(),\n            },\n          });\n\n          return { metrics, assessment, scoring };\n        });\n\n        return responseJson({\n          status: "ok",\n          saved: true,\n          completed: true,\n          classification: saved.assessment.overallClassification,\n          experienceRating: saved.metrics.experienceRating,\n          metrics: {\n            ...saved.scoring,\n            observationLevel: saved.metrics.observationLevel,\n            remarks: saved.metrics.remarks || "",\n            classification: saved.assessment.overallClassification,\n          },\n        });\n      } catch (error) {\n        console.error("save_final_assessment_review error:", error);\n        return responseJson({ error: "Unable to save the final assessment review." }, 500);\n      }\n    }\n\n    /* ====================================================================== */\n    /* FINALIZE                                                                */\n    /* ====================================================================== */'''
          assert a.count(marker) == 1
          a = a.replace(marker, final_endpoint, 1)

          api.write_text(a, encoding='utf-8')
          PY

