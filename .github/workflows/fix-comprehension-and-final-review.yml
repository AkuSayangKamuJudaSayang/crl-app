          assert l.count(old) == 1
          l = l.replace(old, new, 1)

          old = '''  const resetToCodeEntry =\n    useCallback(\n      () => {'''
          new = '''  const experienceSubmittedRef = useRef(false);\n\n  const resetToCodeEntry =\n    useCallback(\n      () => {'''
