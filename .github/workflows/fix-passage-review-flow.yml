name: Repair passage review flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply passage review fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = path.read_text(encoding='utf-8')

          # Review-mode word clicks open the miscue drawer.
          handler_start = text.index('if (miscueReviewMode) {')
          handler_end = text.index('return;', handler_start)
          handler = text[handler_start:handler_end]
          handler = handler.replace('setMiscueDrawerOpen(false);', 'setMiscueDrawerOpen(true);', 1)
          text = text[:handler_start] + handler + text[handler_end:]

          # Apply a miscue: update the passage highlight immediately, clear the
          # blue selected-word state, then persist the draft in the background.
          record_start = text.index('const recordPassageMiscue =')
          record_end = text.index('\n  useEffect(() => {', record_start)
          record = text[record_start:record_end]
          record = re.sub(
              r'\n\s*if \(!miscueReviewMode\) \{\n\s*setMiscueDrawerOpen\(false\);\n\s*setSelectedPassageWord\(null\);\n\s*setSelectedMiscueType\(null\);\n\s*\}',
              '',
              record,
              count=1,
          )
          anchor = '''        setMiscueWordIndex(1);\n\n        await persistPassageDraft({'''
          if anchor not in record:
              raise SystemExit('record close anchor not found')
          record = record.replace(
              anchor,
              '''        setMiscueWordIndex(1);\n        setMiscueDrawerOpen(false);\n        setSelectedPassageWord(null);\n        setSelectedMiscueType(null);\n\n        await persistPassageDraft({''',
              1,
          )
          text = text[:record_start] + record + text[record_end:]

          # Remove-miscue also closes the selected-word overlay immediately.
          remove_start = text.index('const removePassageMiscue =')
          remove_end = text.index('\n\n  const recordPassageMiscue =', remove_start)
          remove = text[remove_start:remove_end]
          remove = re.sub(
              r'\n\s*if \(!miscueReviewMode\) \{\n\s*setMiscueDrawerOpen\(false\);\n\s*setSelectedPassageWord\(null\);\n\s*\}',
              '',
              remove,
              count=1,
          )
          anchor = '''        setError("");\n\n        await persistPassageDraft({'''
          if anchor not in remove:
              raise SystemExit('remove close anchor not found')
          remove = remove.replace(
              anchor,
              '''        setError("");\n        setMiscueDrawerOpen(false);\n        setSelectedPassageWord(null);\n\n        await persistPassageDraft({''',
              1,
          )
          text = text[:remove_start] + remove + text[remove_end:]

          # Word handlers must be recreated when review mode changes.
          word_start = text.index('const passageWordElements =')
          word_end = text.index('const finishPassageReading =', word_start)
          word_block = text[word_start:word_end]
          if '        miscueReviewMode,\n      ]\n    );' not in word_block:
              deps = '        timeUpReviewConfirmed,\n      ]\n    );'
              if deps not in word_block:
                  raise SystemExit('passage word dependency block not found')
              word_block = word_block.replace(
                  deps,
                  '        timeUpReviewConfirmed,\n        miscueReviewMode,\n      ]\n    );',
                  1,
              )
              text = text[:word_start] + word_block + text[word_end:]

          # Finish Reading freezes the local clock immediately.
          finish_style = text.index('style={styles.primaryPassageButton}')
          click_start = text.index('onClick={() => {', finish_style)
          click_end = text.index('}}', click_start) + 2
          click = text[click_start:click_end]
          if 'setMiscueReviewMode(true);' not in click:
              raise SystemExit('Finish Reading review entry not found')
          if 'passageTimerRef.current' not in click:
              click = click.replace(
                  'onClick={() => {\n',
                  '''onClick={() => {\n                              passageClockRef.current.frozenSeconds = passageSeconds;\n                              if (passageTimerRef.current) {\n                                window.clearInterval(passageTimerRef.current);\n                                passageTimerRef.current = null;\n                              }\n                              setTimeUpSelecting(false);\n                              setTimeUpReviewConfirmed(false);\n''',
                  1,
              )
          text = text[:click_start] + click + text[click_end:]

          # Timer effect is permanently stopped while the review prompt is active.
          timer_anchor = '''    const startedAt =\n      session?.passage_started_at ||\n      session?.passageStartedAt;'''
          if 'if (miscueReviewMode) {' not in text[text.rfind('useEffect(() => {', 0, text.index(timer_anchor)):text.index(timer_anchor)]:
              guard = '''    if (miscueReviewMode) {\n      if (passageTimerRef.current) {\n        window.clearInterval(passageTimerRef.current);\n        passageTimerRef.current = null;\n      }\n      return undefined;\n    }\n\n'''
              text = text.replace(timer_anchor, guard + timer_anchor, 1)

          timer_deps = '''  }, [\n    activeStage,\n    session?.passage_started_at,\n    session?.passageStartedAt,\n  ]);'''
          if timer_deps in text:
              text = text.replace(
                  timer_deps,
                  '''  }, [\n    activeStage,\n    miscueReviewMode,\n    session?.passage_started_at,\n    session?.passageStartedAt,\n  ]);''',
                  1,
              )

          # Inline review prompt: instructions + confirmation button only.
          start_marker = '''                      {miscueReviewMode && !timeUpSelecting && (\n                        <div style={styles.miscueInlinePrompt}>'''
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('inline review prompt not found')
          end_marker = '''                      {!miscueReviewMode && !timeUpSelecting && ('''
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('inline review prompt end not found')
          prompt = '''                      {miscueReviewMode && !timeUpSelecting && (\n                        <div style={styles.miscueInlinePrompt}>\n                          <div style={styles.miscueInlinePromptBadge}>REVIEW</div>\n                          <div style={styles.miscueInlinePromptTitle}>Review passage miscues</div>\n                          <div style={styles.miscueInlinePromptText}>\n                            Optionally press any word in the original passage above where you observed a miscue. Leave every word unchanged when there are no miscues.\n                          </div>\n                          <button\n                            type="button"\n                            style={styles.miscueInlineConfirmButton}\n                            onClick={() =>\n                              void finishPassageReading(\n                                passageSeconds,\n                                passageSeconds >= 120 ? passageWordsRead || 0 : 100\n                              )\n                            }\n                            disabled={busy || passageFinalizingRef.current}\n                          >\n                            Confirm & Continue\n                          </button>\n                        </div>\n                      )}\n\n'''
          text = text[:start] + prompt + text[end:]

          # Slightly larger prompt typography.
          patterns = [
              (r'(miscueInlinePromptBadge: \{[^}]*fontSize: )"10px"', r'\g<1>"11px"'),
              (r'(miscueInlinePromptTitle: \{[^}]*fontSize: )"20px"', r'\g<1>"22px"'),
              (r'(miscueInlinePromptText: \{[^}]*fontSize: )"12px"', r'\g<1>"14px"'),
              (r'(miscueInlineConfirmButton: \{[^}]*fontSize: )"14px"', r'\g<1>"15px"'),
          ]
          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'style patch target missing: {pattern}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source and production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/teacher/assessment/AssessmentClient.jsx').read_text(encoding='utf-8')
          word_start = s.index('const passageWordElements =')
          word_end = s.index('const finishPassageReading =', word_start)
          word = s[word_start:word_end]
          review_branch = word[word.index('if (miscueReviewMode) {'):word.index('return;', word.index('if (miscueReviewMode) {'))]
          assert 'setMiscueDrawerOpen(true);' in review_branch
          assert 'setMiscueDrawerOpen(false);' not in review_branch
          assert 'miscueReviewMode,' in word
          record_start = s.index('const recordPassageMiscue =')
          record_end = s.index('\n  useEffect(() => {', record_start)
          record = s[record_start:record_end]
          assert 'if (!miscueReviewMode)' not in record
          close_pos = record.index('setMiscueDrawerOpen(false);')
          persist_pos = record.index('await persistPassageDraft({')
          assert close_pos < persist_pos
          review_start = s.index('{miscueReviewMode && !timeUpSelecting && (')
          review_end = s.index('{!miscueReviewMode && !timeUpSelecting && (', review_start)
          review = s[review_start:review_end]
          assert 'Optionally press any word in the original passage above' in review
          assert 'Confirm & Continue' in review
          assert 'miscueInlineTypeGrid' not in review
          assert 'miscueInlineSelectedWord' not in review
          assert 'Remove Miscue' not in review
          assert 'if (miscueReviewMode) {' in s
          assert 'window.clearInterval(passageTimerRef.current);' in s
          assert 'Para flies away' in s
          assert 'Dulnuwan is a farmer' in s
          print('passage review source invariants: OK')
          PY
          git diff --check
          npm install --package-lock=false
          npm run build

      - name: Commit verified fix and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx .github/workflows/fix-passage-review-flow.yml .github/workflows/fix-passage-review-final.yml
          git commit -m 'Fix passage review interactions and timer'
          git rm .github/workflows/fix-passage-review-flow.yml .github/workflows/fix-passage-review-final.yml
          git commit -m 'Remove temporary passage review verifiers'
          git push
