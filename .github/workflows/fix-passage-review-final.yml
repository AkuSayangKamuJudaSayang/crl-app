name: Fix passage review interactions

on:
  push:
    paths:
      - ".github/workflows/fix-passage-review-final.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/teacher/assessment/AssessmentClient.jsx")
          text = path.read_text(encoding="utf-8")

          # 1) Keep the review-mode word handler in the existing miscue flow.
          assert 'if (miscueReviewMode) {' in text, 'review-mode handler missing'
          assert 'setMiscueDrawerOpen(true);' in text, 'review drawer open behavior missing'

          # 2) Freeze the passage timer as soon as Finish Reading enters review mode.
          finish_start = text.index('const finishPassageReading =')
          inline_finish = text.index('style={styles.primaryPassageButton}', finish_start)
          on_click_start = text.index('onClick={() => {', inline_finish)
          on_click_end = text.index('}}', on_click_start) + 2
          on_click = text[on_click_start:on_click_end]
          assert 'setMiscueReviewMode(true);' in on_click, 'Finish Reading review entry missing'
          assert 'controlPassageTimer("pause")' not in on_click, 'pause already applied unexpectedly'
          on_click = on_click.replace(
              'setMiscueReviewMode(true);',
              'setMiscueReviewMode(true);\n                              void controlPassageTimer("pause");',
              1,
          )
          text = text[:on_click_start] + on_click + text[on_click_end:]

          # 3) Make applying a miscue close/clear the selected-word state even in review mode.
          record_start = text.index('const recordPassageMiscue =')
          record_end = text.index('  useEffect(() => {', record_start)
          record_block = text[record_start:record_end]
          old_close = '''        if (!miscueReviewMode) {
          setMiscueDrawerOpen(false);
          setSelectedPassageWord(null);
          setSelectedMiscueType(null);
        }'''
          assert old_close in record_block, 'record close block missing'
          record_block = record_block.replace(
              old_close,
              '''        setMiscueDrawerOpen(false);
        setSelectedPassageWord(null);
        setSelectedMiscueType(null);''',
              1,
          )
          text = text[:record_start] + record_block + text[record_end:]

          # 4) Recompute word handlers when review mode changes so the click behavior
          #    cannot retain the pre-review closure.
          deps_old = '''        selectedPassageWord,
        timeUpSelecting,
        timeUpReviewConfirmed,
      ]
    );'''
          deps_new = '''        selectedPassageWord,
        timeUpSelecting,
        timeUpReviewConfirmed,
        miscueReviewMode,
      ]
    );'''
          assert deps_old in text, 'passage word memo dependency block missing'
          text = text.replace(deps_old, deps_new, 1)

          # 5) Replace the inline review card with instructions + confirm only.
          prompt_start_marker = '                      {miscueReviewMode && !timeUpSelecting && ('
          prompt_end_marker = '                      {timeUpSelecting && ('
          start = text.index(prompt_start_marker)
          end = text.index(prompt_end_marker, start)
          replacement = '''                      {miscueReviewMode && !timeUpSelecting && (
                        <div style={styles.miscueInlinePrompt}>
                          <div style={styles.miscueInlinePromptBadge}>REVIEW</div>
                          <div style={styles.miscueInlinePromptTitle}>Review passage miscues</div>
                          <div style={styles.miscueInlinePromptText}>
                            Optionally press any word in the original passage above where you observed a miscue. Leave every word unchanged when there are no miscues.
                          </div>
                          <button
                            type="button"
                            style={styles.miscueInlineConfirmButton}
                            onClick={() => void finishPassageReading(
                              passageSeconds,
                              passageSeconds >= 120 ? passageWordsRead || 0 : 100
                            )}
                            disabled={busy || passageFinalizingRef.current}
                          >
                            Confirm & Continue
                          </button>
                        </div>
                      )}

'''
          text = text[:start] + replacement + text[end:]

          # 6) Slightly enlarge the review instruction typography.
          style_replacements = {
              'miscueInlinePromptBadge: { display: "inline-block", padding: "4px 8px", borderRadius: "999px", background: "#e7f0f8", color: "#2769a8", fontSize: "10px",':
              'miscueInlinePromptBadge: { display: "inline-block", padding: "5px 9px", borderRadius: "999px", background: "#e7f0f8", color: "#2769a8", fontSize: "11px",',
              'miscueInlinePromptTitle: { marginTop: "7px", color: "#1f435f", fontSize: "20px", fontWeight: "950" },':
              'miscueInlinePromptTitle: { marginTop: "8px", color: "#1f435f", fontSize: "22px", fontWeight: "950" },',
              'miscueInlinePromptText: { marginTop: "6px", color: "#6f8498", fontSize: "12px", lineHeight: 1.5 },':
              'miscueInlinePromptText: { marginTop: "7px", color: "#6f8498", fontSize: "14px", lineHeight: 1.6 },',
              'miscueInlineConfirmButton: { width: "100%", minHeight: "48px", marginTop: "13px", border: 0, borderRadius: "12px", background: "linear-gradient(145deg,#2f8f61,#1e744c)", color: "#ffffff", fontSize: "14px",':
              'miscueInlineConfirmButton: { width: "100%", minHeight: "50px", marginTop: "14px", border: 0, borderRadius: "12px", background: "linear-gradient(145deg,#2f8f61,#1e744c)", color: "#ffffff", fontSize: "15px",',
          }
          for old, new in style_replacements.items():
              assert old in text, f'missing style fragment: {old[:80]}'
              text = text.replace(old, new, 1)

          # Ensure the removed controls are no longer rendered inside the instruction card.
          review_slice = text[start:start + len(replacement)]
          assert 'miscueInlineTypeGrid' not in review_slice
          assert 'miscueInlineSelectedWord' not in review_slice
          assert 'removeMiscueButton' not in review_slice
          assert text.count('controlPassageTimer("pause");') >= 1

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/teacher/assessment/AssessmentClient.jsx')
          s = p.read_text(encoding='utf-8')
          review_start = s.index('{miscueReviewMode && !timeUpSelecting && (')
          review_end = s.index('{timeUpSelecting && (', review_start)
          review = s[review_start:review_end]
          assert 'Review passage miscues' in review
          assert 'Optionally press any word in the original passage above' in review
          assert 'Confirm & Continue' in review
          assert 'miscueInlineTypeGrid' not in review
          assert 'miscueInlineSelectedWord' not in review
          assert 'Remove Miscue' not in review
          assert 'void controlPassageTimer("pause");' in s
          record_start = s.index('const recordPassageMiscue =')
          record_end = s.index('useEffect(() => {', record_start)
          record = s[record_start:record_end]
          assert 'setMiscueDrawerOpen(false);' in record
          assert 'setSelectedPassageWord(null);' in record
          assert 'setSelectedMiscueType(null);' in record
          assert 'if (!miscueReviewMode)' not in record
          marker = '        timeUpSelecting,\n        timeUpReviewConfirmed,\n        miscueReviewMode,\n'
          assert marker in s
          print('source invariants: OK')
          PY
          git diff --check

      - name: Build production app
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
        run: |
          npm install --package-lock=false
          npm run build

      - name: Commit verified fix and remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/assessment/AssessmentClient.jsx .github/workflows/fix-passage-review-final.yml
          git commit -m "Fix passage review workflow and miscues"
          git rm .github/workflows/fix-passage-review-final.yml
          git commit -m "Remove temporary passage review verifier"
          git push
