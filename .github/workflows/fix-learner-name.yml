name: Fix learner name formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix learner name formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch learner name handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/teacher/page.jsx')
          text = path.read_text()

          old_format = '''  const initial = middle\n    ? `${middle\n        .trim()\n        .charAt(0)\n        .toUpperCase()}.`\n    : "";\n\n  return [\n    last,\n    first,\n    initial,\n  ]\n    .filter(Boolean)\n    .join(", ");'''

          new_format = '''  const normalizedMiddle = middle\n    .trim()\n    .replace(/^(n\\/?a|none|null|undefined|-|—)$/i, "");\n\n  const initial = normalizedMiddle\n    ? `${normalizedMiddle.charAt(0).toUpperCase()}.`\n    : "";\n\n  const familyAndGiven = [last, first]\n    .map((value) => String(value).trim())\n    .filter(Boolean)\n    .join(", ");\n\n  return [familyAndGiven, initial]\n    .map((value) => String(value).trim())\n    .filter(Boolean)\n    .join(" ");'''

          if text.count(old_format) != 1:
              raise SystemExit(f'formatName patch target count was {text.count(old_format)}, expected 1')
          text = text.replace(old_format, new_format, 1)

          old_middle = '              middle_name: row.middleName || "N/A",'
          new_middle = '              middle_name: row.middleName || null,'
          if text.count(old_middle) != 1:
              raise SystemExit(f'blank middle-name save target count was {text.count(old_middle)}, expected 1')
          text = text.replace(old_middle, new_middle, 1)

          path.write_text(text)
          PY

      - name: Verify change
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'normalizedMiddle' app/teacher/page.jsx
          grep -q 'join(" ")' app/teacher/page.jsx
          grep -q 'middle_name: row.middleName || null' app/teacher/page.jsx
          if grep -q 'middle_name: row.middleName || "N/A"' app/teacher/page.jsx; then exit 1; fi

      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-learner-name.yml
          git add app/teacher/page.jsx .github/workflows/fix-learner-name.yml
          git commit -m 'Fix learner name formatting'
          git push
