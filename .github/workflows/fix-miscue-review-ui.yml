name: Fix passage miscue review UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply passage miscue review UI fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch assessment review flow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = path.read_text(encoding='utf-8')

          # 1) In review mode, clicking a word selects it in the original passage
          # instead of opening the modal/drawer.
          old = '''                  setSelectedPassageWord(\n                    number\n                  );\n                  setMiscueWordIndex(\n                    number\n                  );\n                  setSelectedMiscueType(\n                    existingMiscue?.miscueType ||\n                      null\n                  );\n                  setMisreadWord(\n                    existingMiscue?.misreadWord ||\n                      \"\"\n                  );\n                  setMiscueDrawerOpen(\n                    true\n                  );'''
          new = '''                  if (miscueReviewMode) {\n                    setSelectedPassageWord(number);\n                    setMiscueWordIndex(number);\n                    setSelectedMiscueType(existingMiscue?.miscueType || null);\n                    setMisreadWord(existingMiscue?.misreadWord || \"\");\n                    setMiscueDrawerOpen(false);\n                    return;\n                  }\n\n                  setSelectedPassageWord(\n                    number\n                  );\n                  setMiscueWordIndex(\n                    number\n                  );\n                  setSelectedMiscueType(\n                    existingMiscue?.miscueType ||\n                      null\n                  );\n                  setMisreadWord(\n                    existingMiscue?.misreadWord ||\n                      \"\"\n                  );\n                  setMiscueDrawerOpen(\n                    true\n                  );'''
          if text.count(old) != 1:
              raise SystemExit(f'word click patch target count={text.count(old)}, expected 1')
          text = text.replace(old, new, 1)

          # 2) Pressing Finish Reading enters inline review mode only.
          old = '''                            onClick={() => {\n                              setMiscueReviewMode(true);\n                              setMiscueDrawerOpen(true);\n                              setSelectedPassageWord(null);\n                              setSelectedMiscueType(null);\n                              setMisreadWord(\"\");\n                              setError(\"\");\n                            }}'''
          new = '''                            onClick={() => {\n                              setMiscueReviewMode(true);\n                              setMiscueDrawerOpen(false);\n                              setSelectedPassageWord(null);\n                              setSelectedMiscueType(null);\n                              setMisreadWord(\"\");\n                              setError(\"\");\n                            }}'''
          if text.count(old) != 1:
              raise SystemExit(f'finish button patch target count={text.count(old)}, expected 1')
          text = text.replace(old, new, 1)

          # 3) Hide the timer and Finish Reading button while the inline review prompt is active.
          old = '''                      {passageSeconds < 120 && ('''
          new = '''                      {passageSeconds < 120 && !miscueReviewMode && ('''
          if text.count(old) != 1:
              raise SystemExit(f'timer condition count={text.count(old)}, expected 1')
          text = text.replace(old, new, 1)

          old = '''                      {!timeUpSelecting && (\n                        <div style={styles.passageFinishRow}>'''
          new = '''                      {!miscueReviewMode && !timeUpSelecting && (\n                        <div style={styles.passageFinishRow}>'''
          if text.count(old) != 1:
              raise SystemExit(f'finish-row condition count={text.count(old)}, expected 1')
          text = text.replace(old, new, 1)

          # 4) Put the review prompt exactly where the timer/Finish Reading controls were.
          marker = '''\n\n                      {!miscueReviewMode && !timeUpSelecting && (\n                        <div style={styles.passageFinishRow}>'''
          prompt = '''\n\n                      {miscueReviewMode && !timeUpSelecting && (\n                        <div style={styles.miscueInlinePrompt}>\n                          <div style={styles.miscueInlinePromptBadge}>REVIEW</div>\n                          <div style={styles.miscueInlinePromptTitle}>Review passage miscues</div>\n                          <div style={styles.miscueInlinePromptText}>\n                            Optionally press any word in the original passage above where you observed a miscue.\n                            Leave every word unchanged when there are no miscues.\n                          </div>\n\n                          <div style={styles.miscueInlineSelectedWord}>\n                            <span style={styles.miscueInlineSelectedLabel}>Selected word</span>\n                            <strong>\n                              {selectedPassageWord\n                                ? passageText.split(/\\s+/).filter(Boolean)[Number(selectedPassageWord) - 1] || \"\"\n                                : \"Select a word above\"}\n                            </strong>\n                          </div>\n\n                          {selectedPassageWord ? (\n                            <>\n                              <div style={styles.miscueInlineTypeGrid}>\n                                {[\n                                  [\"Insertion\", \"Added word or sound\", \"#1766a9\", \"#dff1ff\"],\n                                  [\"Omission\", \"Word was skipped\", \"#b32031\", \"#ffe5e8\"],\n                                  [\"Substitution\", \"Another word was said\", \"#955900\", \"#fff0d9\"],\n                                  [\"Repetition\", \"Word was repeated\", \"#7041a8\", \"#eee5ff\"],\n                                  [\"SelfCorrection\", \"Learner corrected the error\", \"#287447\", \"#e2f7e9\"],\n                                ].map(([label, hint, color, background]) => (\n                                  <button\n                                    key={label}\n                                    type=\"button\"\n                                    style={{\n                                      ...styles.miscueInlineTypeButton,\n                                      color,\n                                      background,\n                                      borderColor: color,\n                                      ...(selectedMiscueType === label ? styles.miscueInlineTypeButtonSelected : {}),\n                                    }}\n                                    onClick={() => {\n                                      setSelectedMiscueType(label);\n                                      if (label !== \"Insertion\" && label !== \"Substitution\") {\n                                        void recordPassageMiscue(selectedPassageWord, label, \"\");\n                                      }\n                                    }}\n                                  >\n                                    <span>\n                                      <strong style={styles.miscueInlineTypeName}>\n                                        {label === \"SelfCorrection\" ? \"Self-Correction\" : label}\n                                      </strong>\n                                      <small style={styles.miscueInlineTypeHint}>{hint}</small>\n                                    </span>\n                                    <span style={{ ...styles.miscueInlineTypeArrow, color }}>→</span>\n                                  </button>\n                                ))}\n                              </div>\n\n                              {(selectedMiscueType === \"Insertion\" || selectedMiscueType === \"Substitution\") && (\n                                <div style={styles.miscueInlineEntry}>\n                                  <label style={styles.miscueInlineEntryLabel}>\n                                    What did the learner say?\n                                  </label>\n                                  <input\n                                    type=\"text\"\n                                    value={misreadWord}\n                                    onChange={(event) => setMisreadWord(event.target.value)}\n                                    placeholder={\n                                      selectedMiscueType === \"Insertion\"\n                                        ? \"Enter the word/sound the learner added\"\n                                        : \"Enter the word the learner substituted\"\n                                    }\n                                    style={styles.miscueInlineInput}\n                                    disabled={recordingMiscue}\n                                  />\n                                  <button\n                                    type=\"button\"\n                                    style={styles.miscueInlineApplyButton}\n                                    onClick={() => void recordPassageMiscue(selectedPassageWord, selectedMiscueType, misreadWord)}\n                                    disabled={recordingMiscue || !misreadWord.trim()}\n                                  >\n                                    Apply Miscue\n                                  </button>\n                                </div>\n                              )}\n\n                              {passageMiscues.some(\n                                (item) => Number(item.wordIndex) === Number(selectedPassageWord || 0) - 1\n                              ) && (\n                                <button\n                                  type=\"button\"\n                                  style={styles.removeMiscueButton}\n                                  onClick={() => void removePassageMiscue()}\n                                  disabled={recordingMiscue}\n                                >\n                                  Remove Miscue\n                                </button>\n                              )}\n                            </>\n                          ) : null}\n\n                          <button\n                            type=\"button\"\n                            style={styles.miscueInlineConfirmButton}\n                            onClick={() => {\n                              void finishPassageReading(\n                                passageSeconds,\n                                passageSeconds >= 120 ? passageWordsRead || 0 : 100\n                              );\n                            }}\n                            disabled={busy || passageFinalizingRef.current}\n                          >\n                            Confirm &amp; Continue\n                          </button>\n                        </div>\n                      )}'''
          if text.count(marker) != 1:
              raise SystemExit(f'prompt insertion marker count={text.count(marker)}, expected 1')
          text = text.replace(marker, prompt + marker, 1)

          # 5) Remove the modal/portal entirely. Inline review is now the only review UI
          # after Finish Reading. Normal in-reading miscue selection remains unchanged.
          pattern = re.compile(\n              r'\\n\\s*\\{miscueDrawerOpen && typeof document !== \\\"undefined\\\"\\s*\\n\\s*\\? createPortal\\(.*?\\n\\s*: null\\}',\n              re.S,\n          )
          text, removed = pattern.subn('', text, count=1)
          if removed != 1:
              raise SystemExit(f'expected to remove 1 miscue portal, removed={removed}')

          # createPortal is no longer used after removing the review overlay.
          text = text.replace('import { createPortal } from \"react-dom\";\n\n', '', 1)

          # 6) Add compact inline-review styles next to the existing review styles.
          style_marker = '''  miscueOverlay: {'''
          style_block = '''  miscueInlinePrompt: {\n    width: \"min(760px,100%)\",\n    margin: \"0 auto\",\n    padding: \"18px\",\n    borderRadius: \"18px\",\n    background: \"linear-gradient(145deg,#f8fbff,#edf5fb)\",\n    border: \"1px solid #d5e2ec\",\n    boxShadow: \"8px 10px 20px rgba(63,96,128,.12), -5px -5px 10px rgba(255,255,255,.92)\",\n    textAlign: \"left\",\n  },\n  miscueInlinePromptBadge: {\n    display: \"inline-block\",\n    padding: \"4px 8px\",\n    borderRadius: \"999px\",\n    background: \"#e7f0f8\",\n    color: \"#2769a8\",\n    fontSize: \"10px\",\n    fontWeight: \"950\",\n    letterSpacing: \".08em\",\n  },\n  miscueInlinePromptTitle: {\n    marginTop: \"7px\",\n    color: \"#1f435f\",\n    fontSize: \"20px\",\n    fontWeight: \"950\",\n  },\n  miscueInlinePromptText: {\n    marginTop: \"6px\",\n    color: \"#6f8498\",\n    fontSize: \"12px\",\n    lineHeight: 1.5,\n  },\n  miscueInlineSelectedWord: {\n    display: \"flex\",\n    alignItems: \"center\",\n    justifyContent: \"space-between\",\n    gap: \"10px\",\n    marginTop: \"12px\",\n    padding: \"10px 12px\",\n    borderRadius: \"12px\",\n    background: \"#ffffff\",\n    border: \"1px solid #dbe7f0\",\n  },\n  miscueInlineSelectedLabel: {\n    color: \"#7a8ea1\",\n    fontSize: \"10px\",\n    fontWeight: \"900\",\n    textTransform: \"uppercase\",\n    letterSpacing: \".08em\",\n  },\n  miscueInlineTypeGrid: {\n    display: \"grid\",\n    gridTemplateColumns: \"repeat(5,minmax(0,1fr))\",\n    gap: \"8px\",\n    marginTop: \"12px\",\n  },\n  miscueInlineTypeButton: {\n    minHeight: \"64px\",\n    padding: \"8px\",\n    borderRadius: \"11px\",\n    border: \"1px solid\",\n    cursor: \"pointer\",\n    display: \"flex\",\n    alignItems: \"center\",\n    justifyContent: \"space-between\",\n    gap: \"6px\",\n    textAlign: \"left\",\n  },\n  miscueInlineTypeButtonSelected: {\n    boxShadow: \"0 0 0 2px rgba(47,115,201,.22)\",\n    transform: \"translateY(-1px)\",\n  },\n  miscueInlineTypeName: {\n    display: \"block\",\n    fontSize: \"11px\",\n    lineHeight: 1.15,\n  },\n  miscueInlineTypeHint: {\n    display: \"block\",\n    marginTop: \"4px\",\n    color: \"#6e8192\",\n    fontSize: \"9px\",\n    lineHeight: 1.25,\n  },\n  miscueInlineTypeArrow: {\n    fontSize: \"15px\",\n    fontWeight: \"950\",\n  },\n  miscueInlineEntry: {\n    display: \"grid\",\n    gridTemplateColumns: \"1fr auto\",\n    gap: \"8px\",\n    alignItems: \"end\",\n    marginTop: \"11px\",\n  },\n  miscueInlineEntryLabel: {\n    gridColumn: \"1 / -1\",\n    color: \"#60778c\",\n    fontSize: \"10px\",\n    fontWeight: \"900\",\n  },\n  miscueInlineInput: {\n    minHeight: \"42px\",\n    padding: \"0 11px\",\n    borderRadius: \"10px\",\n    border: \"1px solid #cfdde8\",\n    background: \"#ffffff\",\n    color: \"#213b57\",\n    outline: \"none\",\n  },\n  miscueInlineApplyButton: {\n    minHeight: \"42px\",\n    padding: \"0 13px\",\n    border: 0,\n    borderRadius: \"10px\",\n    background: \"linear-gradient(145deg,#2f73c9,#1559a6)\",\n    color: \"#ffffff\",\n    fontSize: \"11px\",\n    fontWeight: \"950\",\n    cursor: \"pointer\",\n  },\n  miscueInlineConfirmButton: {\n    width: \"100%\",\n    minHeight: \"48px\",\n    marginTop: \"13px\",\n    border: 0,\n    borderRadius: \"12px\",\n    background: \"linear-gradient(145deg,#2f8f61,#1e744c)\",\n    color: \"#ffffff\",\n    fontSize: \"14px\",\n    fontWeight: \"950\",\n    cursor: \"pointer\",\n  },\n\n'''
          if text.count(style_marker) != 1:
              raise SystemExit(f'style insertion marker count={text.count(style_marker)}, expected 1')
          text = text.replace(style_marker, style_block + style_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'miscueInlinePrompt' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'Review passage miscues' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'Confirm &amp; Continue' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'miscueReviewMode &&' app/teacher/assessment/AssessmentClient.jsx
          if grep -q 'miscueOverlay' app/teacher/assessment/AssessmentClient.jsx; then exit 1; fi
          if grep -q 'createPortal' app/teacher/assessment/AssessmentClient.jsx; then exit 1; fi

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-miscue-review-ui.yml
          git add app/teacher/assessment/AssessmentClient.jsx .github/workflows/fix-miscue-review-ui.yml
          git commit -m 'Apply passage miscue review UI fix'
          git push
