name: Finalize passage miscue overlay v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/teacher/assessment/AssessmentClient.jsx')
          s=p.read_text(encoding='utf-8')
          pat=re.compile(r'(if \(miscueReviewMode\) \{.*?setMisreadWord\(existingMiscue\?\.misreadWord \|\| ""\);\s*)setMiscueDrawerOpen\(false\);',re.S)
          s,n=pat.subn(r'\1setMiscueDrawerOpen(true);',s,count=1)
          if n!=1: raise SystemExit(f'review-click patch={n}')
          if 'miscueDrawerOpen && selectedPassageWord' not in s:
            marker='''        {confirmFinishReading && ('''
            if s.count(marker)!=1: raise SystemExit('overlay marker missing')
            overlay='''        {miscueDrawerOpen && selectedPassageWord && (\n          <div style={styles.miscueOverlay} role="dialog" aria-modal="true" aria-labelledby="passage-miscue-title">\n            <div style={styles.miscueDrawer}>\n              <div style={styles.miscueDrawerHeader}>\n                <div>\n                  <div style={styles.miscueDrawerEyebrow}>MISCUE OBSERVATION</div>\n                  <div id="passage-miscue-title" style={styles.miscueDrawerWord}>{passageText.split(/\\s+/).filter(Boolean)[Number(selectedPassageWord)-1] || "Selected word"}</div>\n                  <div style={styles.miscueDrawerHint}>Choose the miscue type observed for this word.</div>\n                </div>\n                <button type="button" style={styles.miscueDrawerClose} aria-label="Close miscue options" onClick={() => {setMiscueDrawerOpen(false);setSelectedMiscueType(null);setMisreadWord("");}}>×</button>\n              </div>\n              <div style={styles.miscueTypeGrid}>\n                {[['Insertion','Added word or sound','#1766a9','#dff1ff'],['Omission','Word was skipped','#b32031','#ffe5e8'],['Substitution','Another word was said','#955900','#fff0d9'],['Repetition','Word was repeated','#7041a8','#eee5ff'],['SelfCorrection','Learner corrected the error','#287447','#e2f7e9']].map(([label,description,color,background]) => (\n                  <button key={label} type="button" disabled={recordingMiscue} style={{...styles.miscueTypeButton,color,background,borderColor:color,...(selectedMiscueType===label?styles.miscueTypeButtonSelected:{})}} onClick={() => {setSelectedMiscueType(label);if(label!=='Insertion'&&label!=='Substitution')void recordPassageMiscue(selectedPassageWord,label,'');}}>\n                    <span style={styles.miscueTypeText}><span style={styles.miscueTypeName}>{label==='SelfCorrection'?'Self-Correction':label}</span><span style={styles.miscueTypeDescription}>{description}</span></span>\n                    <span style={{...styles.miscueTypeArrow,color}}>→</span>\n                  </button>\n                ))}\n              </div>\n              {(selectedMiscueType==='Insertion'||selectedMiscueType==='Substitution') && (\n                <div style={styles.miscueEntryArea}>\n                  <label style={styles.miscueEntryLabel}>What did the learner say?</label>\n                  <input type="text" value={misreadWord} onChange={e=>setMisreadWord(e.target.value)} placeholder={selectedMiscueType==='Insertion'?'Enter the word/sound added':'Enter the substituted word'} style={styles.miscueDrawerInput} disabled={recordingMiscue} autoFocus />\n                  <button type="button" style={styles.miscueApplyButton} onClick={() => void recordPassageMiscue(selectedPassageWord,selectedMiscueType,misreadWord)} disabled={recordingMiscue||!misreadWord.trim()}>Apply Miscue</button>\n                </div>\n              )}\n              {passageMiscues.some(item=>Number(item.wordIndex)===Number(selectedPassageWord)-1) && <button type="button" style={styles.removeMiscueButton} onClick={() => void removePassageMiscue()} disabled={recordingMiscue}>Remove Miscue</button>}\n            </div>\n          </div>\n        )}\n\n'''
            s=s.replace(marker,overlay+marker,1)
          checks=['miscueDrawerOpen && selectedPassageWord','const PASSAGE_TEXT =','const FIELD_PASSAGE_TEXT =','const passageText =','recordPassageMiscue(selectedPassageWord,selectedMiscueType,misreadWord)']
          for c in checks:
            if c not in s: raise SystemExit('missing '+c)
          if not re.search(r'if \(miscueReviewMode\).*?setMiscueDrawerOpen\(true\);',s,re.S): raise SystemExit('review overlay open missing')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build
      - name: Commit verified source and remove verifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx
          git commit -m 'Fix passage miscue overlay interaction'
          git push origin main
          git rm .github/workflows/finalize-passage-miscue-overlay-v2.yml
          git commit -m 'Remove temporary passage overlay verifier'
          git push origin main
