name: Fix Word Ready Listener

on:
  push:
    branches:
      - fix/word-ready-listener

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded listener fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = path.read_text()

          old = '''  const handleLearnerAssessmentControl = useCallback(\n    (message) => {\n      const control = message?.control;\n      if (control?.action !== "word_first_item_ready") return;\n\n      const incomingCode = String(control.code || "").trim().toUpperCase();\n      if (incomingCode !== String(code || "").trim().toUpperCase()) return;\n\n      const gateKey = String(control.gate_key || "");\n      if (!gateKey) return;\n\n      const current = latestSessionRef.current || session;\n      const expectedGateKey = getAssessmentWordGateKey(code, current);\n      if (gateKey !== expectedGateKey) return;\n\n      learnerWordReadyKeysRef.current.add(gateKey);\n\n      const currentStage = String(current?.stage || latestActiveStageRef.current || "");\n      const currentContent = String(current?.current_content ?? current?.currentContent ?? "").trim();\n      const currentIsFirstWord = currentStage === "word" && WORDS.indexOf(currentContent) === 0;\n\n      if (currentIsFirstWord && wordInitialTransitionGateKeyRef.current === gateKey) {\n        learnerWordReadyKeysRef.current.delete(gateKey);\n        setWordInitialTransitionPending(false);\n      }\n    },\n    [code, session]\n  );\n'''

          new = '''  const handleLearnerAssessmentControl = useCallback(\n    (message) => {\n      const control = message?.control;\n      if (control?.action !== "word_first_item_ready") return;\n\n      const incomingCode = String(control.code || "").trim().toUpperCase();\n      if (incomingCode !== String(code || "").trim().toUpperCase()) return;\n\n      const gateKey = String(control.gate_key || "");\n      if (!gateKey) return;\n\n      // Keep this listener stable across React session updates during the final\n      // Letter -> Word handoff. Always read the current session from the ref so\n      // the learner readiness signal cannot be lost during listener recreation.\n      const current = latestSessionRef.current;\n      if (!current) return;\n\n      const expectedGateKey = getAssessmentWordGateKey(code, current);\n      if (gateKey !== expectedGateKey) return;\n\n      learnerWordReadyKeysRef.current.add(gateKey);\n\n      const currentStage = String(current?.stage || latestActiveStageRef.current || "");\n      const currentContent = String(current?.current_content ?? current?.currentContent ?? "").trim();\n      const currentIsFirstWord = currentStage === "word" && WORDS.indexOf(currentContent) === 0;\n\n      if (currentIsFirstWord && wordInitialTransitionGateKeyRef.current === gateKey) {\n        learnerWordReadyKeysRef.current.delete(gateKey);\n        setWordInitialTransitionPending(false);\n      }\n    },\n    [code]\n  );\n'''

          if old not in text:
              raise SystemExit('Expected Word readiness callback block was not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1))
          print('Applied stable Word readiness listener fix.')
          PY

      - name: Verify targeted invariants
        run: |
          grep -q 'Keep this listener stable across React session updates during the final' app/teacher/assessment/AssessmentClient.jsx
          grep -q '^    \[code\]$' app/teacher/assessment/AssessmentClient.jsx
          test "$(grep -c 'const handleLearnerAssessmentControl = useCallback' app/teacher/assessment/AssessmentClient.jsx)" = "1"

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx
          git commit -m 'Keep Word readiness listener stable'
          git push origin HEAD:fix/word-ready-listener
