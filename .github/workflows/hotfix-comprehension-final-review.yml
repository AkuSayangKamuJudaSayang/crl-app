name: Hotfix comprehension and final review
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Patch remaining flow issues
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          tpath=Path('app/teacher/assessment/AssessmentClient.jsx')
          lpath=Path('app/learner/LearnerAssessmentPage.jsx')
          apath=Path('app/api/assessment/route.js')
          t=tpath.read_text(encoding='utf-8')
          l=lpath.read_text(encoding='utf-8')
          a=apath.read_text(encoding='utf-8')

          # Correct/Incorrect comprehension buttons get the same locked visual treatment.
          comp_start=t.find('                {activeStage ===\n                  "comprehension" && (')
          comp_end=t.find('                {activeStage ===\n                  "completed" && (', comp_start)
          if comp_start < 0 or comp_end < 0: raise SystemExit('comprehension render block not found')
          comp=t[comp_start:comp_end]
          if 'crlComprehensionAnswerButton' not in comp:
              comp=comp.replace('className="crlAnswerButton"','className="crlAnswerButton crlComprehensionAnswerButton"')
              t=t[:comp_start]+comp+t[comp_end:]
          if '.crlComprehensionAnswerButton:disabled' not in t:
              marker='        .crlAnswerButton:disabled {'
              css='''        .crlComprehensionAnswerButton:disabled,\n        .successButton:disabled,\n        .dangerButton:disabled {\n          cursor: not-allowed !important;\n          opacity: .52 !important;\n          filter: grayscale(.18) !important;\n          transform: none !important;\n          box-shadow: 3px 4px 9px rgba(73,96,116,.08) !important;\n        }\n\n'''
              if marker not in t: raise SystemExit('disabled css marker not found')
              t=t.replace(marker,css+marker,1)

          # Hard Task-1-zero response itself must enter learner experience, not terminated/ended.
          old='''          return responseJson({\n            status: "ok",\n            result,\n            completed: false,\n            terminated: true,\n            early_termination: "part1_task1_zero",\n            current_content: "ZERO_SCORE_PART1_TASK1",\n            scoring,\n            session: {\n              id: host.id,\n              code: host.code,\n              stage: "terminated",\n              current_content:\n                "ZERO_SCORE_PART1_TASK1",\n              currentContent:\n                "ZERO_SCORE_PART1_TASK1",\n              story_title: "",\n              storyTitle: "",\n              learner_id: host.learnerId,\n              learnerId: host.learnerId,\n              ended: true,\n              connected: false,\n              linked_at: host.linkedAt,\n              linkedAt: host.linkedAt,\n              updated_at: new Date(),\n              updatedAt: new Date(),\n            },\n          });'''
          new='''          return responseJson({\n            status: "ok",\n            result,\n            completed: false,\n            terminated: false,\n            early_termination: "part1_task1_zero",\n            current_content: "LEARNER_EXPERIENCE",\n            currentContent: "LEARNER_EXPERIENCE",\n            scoring,\n            session: {\n              id: host.id,\n              code: host.code,\n              stage: "learner_experience",\n              current_content: "LEARNER_EXPERIENCE",\n              currentContent: "LEARNER_EXPERIENCE",\n              story_title: "",\n              storyTitle: "",\n              learner_id: host.learnerId,\n              learnerId: host.learnerId,\n              ended: false,\n              connected: true,\n              linked_at: host.linkedAt,\n              linkedAt: host.linkedAt,\n              updated_at: new Date(),\n              updatedAt: new Date(),\n            },\n          });'''
          if old not in a: raise SystemExit('record_letter zero response block not found')
          a=a.replace(old,new,1)

          # host_get must include the result tables used by final review.
          inc_old='''                  sessionMetrics:\n                    true,\n                  passageMiscues: {'''
          inc_new='''                  sessionMetrics:\n                    true,\n                  letterResults: { orderBy: { letterIndex: "asc" } },\n                  wordResults: { orderBy: { wordIndex: "asc" } },\n                  comprehensionResults: { orderBy: { questionIndex: "asc" } },\n                  passageMiscues: {'''
          if inc_old in a and 'letterResults: { orderBy: { letterIndex: "asc" } }' not in a[a.find('assessmentSession:',0):a.find('assessmentSession:',0)+1200]:
              a=a.replace(inc_old,inc_new,1)

          # Legacy zero-score learner path should never auto-reset before rating.
          old='''              resetTimerRef.current =\n                window.setTimeout(() => {\n                  resetTimerRef.current = null;\n                  resetToCodeEntry();\n                }, 3000);'''
          if old in l:
              l=l.replace(old,'              /* Wait for the learner to submit the 1–5 experience rating. */',1)
          old2='''    resetTimerRef.current = window.setTimeout(() => {\n      resetTimerRef.current = null;\n      resetToCodeEntry();\n    }, 3000);'''
          if old2 in l:
              l=l.replace(old2,'    /* Legacy zero-score sessions also remain on the experience screen until rated. */',1)

          tpath.write_text(t,encoding='utf-8')
          lpath.write_text(l,encoding='utf-8')
          apath.write_text(a,encoding='utf-8')
          PY
      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'crlComprehensionAnswerButton' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'stage: "learner_experience"' app/api/assessment/route.js
          grep -q 'current_content: "LEARNER_EXPERIENCE"' app/api/assessment/route.js
          grep -q 'letterResults: { orderBy: { letterIndex: "asc" } }' app/api/assessment/route.js
          grep -q 'save_experience_rating' app/api/assessment/route.js
          grep -q 'save_final_assessment_review' app/api/assessment/route.js
          grep -q 'stage === "learner_experience"' app/learner/LearnerAssessmentPage.jsx
          git diff --check
      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/crl_app
        run: |
          npm install --package-lock=false
          npm run build
      - name: Commit and remove verifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx app/learner/LearnerAssessmentPage.jsx app/api/assessment/route.js .github/workflows/hotfix-comprehension-final-review.yml
          git commit -m 'Fix remaining comprehension and experience flow issues'
          git rm .github/workflows/hotfix-comprehension-final-review.yml
          git commit -m 'Remove temporary comprehension hotfix verifier'
          git push
