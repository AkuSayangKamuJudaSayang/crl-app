name: Apply CRL learner story sync fix

on:
  push:
    branches: [edu-story-sync-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final word transition
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/teacher/assessment/AssessmentClient.jsx')
          s = p.read_text(encoding='utf-8')
          needle = '''        if (data.session) {\n          setSession(data.session);\n          setActiveStage(data.session.stage);\n        }\n\n        setTransitionPending(false);'''
          replacement = '''        if (data.session) {\n          const nextSession = {\n            ...data.session,\n            connected:\n              data.session.connected ??\n              latestSessionRef.current?.connected ??\n              true,\n          };\n\n          latestSessionRef.current = nextSession;\n          latestActiveStageRef.current = String(nextSession.stage || \"\");\n          latestSessionVersionRef.current = Date.now();\n          setSession(nextSession);\n          setActiveStage(nextSession.stage);\n\n          // The final Word Recognition answer changes the authoritative\n          // session to story_choice. Publish that exact server state to the\n          // learner immediately instead of waiting for a status poll.\n          publishAssessmentState(assessmentChannelRef.current, {\n            source: \"teacher\",\n            session: nextSession,\n          });\n          void publishAssessmentRealtimeState(code, nextSession);\n        }\n\n        setTransitionPending(false);'''
          if needle not in s:
              raise SystemExit('Target block not found; aborting patch.')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/assessment/AssessmentClient.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: publish final word to learner story choice"
          git push
