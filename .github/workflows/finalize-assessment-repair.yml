name: Finalize assessment repair

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://crl_ci:crl_ci@127.0.0.1:5432/crl_ci
  DIRECT_URL: postgresql://crl_ci:crl_ci@127.0.0.1:5432/crl_ci

jobs:
  repair:
    if: github.event.head_commit.message == 'Apply final assessment runtime repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final runtime repair
        run: python scripts/finalize_assessment_repair.py

      - name: Validate production build
        run: |
          npm install --package-lock=false
          npm run build
          git diff --check

      - name: Commit and remove temporary tooling
        run: |
          rm -f scripts/finalize_assessment_repair.py .github/workflows/finalize-assessment-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix assessment runtime import and classification'
          git push
