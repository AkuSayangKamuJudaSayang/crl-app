name: Finalize passage miscue repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-passage-miscue-fix.py'
      - 'scripts/apply-passage-miscue-fix.py'
      - '.github/workflows/finalize-passage-miscue-fix.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply final source repair
        run: python scripts/finalize-passage-miscue-fix.py

      - name: Verify final source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = p.read_text(encoding='utf-8')
          required = [
              'setSelectedPassageWord(null);setSelectedMiscueType(null);setReversionSelecting(false);setReversionSourceWord(null);',
              'setReversionSelecting(true);',
              'Select the word the learner reversed',
              "void recordPassageMiscue(Number(reversionSourceWord), 'Reversion', '', number);",
              'reversionOverlay',
          ]
          for needle in required:
              assert needle in text, f'missing required source marker: {needle}'
          assert 'reversionTargetWord' not in text
          assert 'Second word position' not in text
          assert 'Enter the other word number' not in text
          print('Final source verification passed')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run build

      - name: Commit source and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx
          git rm scripts/apply-passage-miscue-fix.py scripts/finalize-passage-miscue-fix.py .github/workflows/apply-passage-miscue-fix.yml .github/workflows/finalize-passage-miscue-fix.yml
          git commit -m 'Fix passage miscue cancel and reversion selection'
          git push origin HEAD:main
