name: Controlled assessment repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run controlled assessment repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize repair script for current client formatting
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/repair_assessment_flow.py')
          s = p.read_text()
          old = """  const [\n    miscueDrawerOpen,\n    setMiscueDrawerOpen,\n  ] = useState(false);"""
          new = """  const [miscueDrawerOpen, setMiscueDrawerOpen] = useState(false);"""
          if old not in s:
              raise SystemExit('repair script state pattern is missing')
          p.write_text(s.replace(old, old + "\\n  # fallback normalization is applied by the repair script\\n", 1))
          s = p.read_text()
          s = s.replace("if old not in text:\n    raise SystemExit('miscueDrawer state not found')", "if old not in text:\n    old = '  const [miscueDrawerOpen, setMiscueDrawerOpen] = useState(False);' if False else '  const [miscueDrawerOpen, setMiscueDrawerOpen] = useState(false);'\n    if old not in text:\n        raise SystemExit('miscueDrawer state not found')", 1)
          p.write_text(s)

      - name: Apply repair
        run: python scripts/repair_assessment_flow.py

      - name: Validate app build
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Commit repaired app and remove temporary tooling
        run: |
          rm -f scripts/repair_assessment_flow.py .github/workflows/repair-assessment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/assessment/AssessmentClient.jsx app/api/assessment/commit/route.js scripts/repair_assessment_flow.py .github/workflows/repair-assessment.yml
          git commit -m 'Fix offline passage review and comprehension flow'
          git push

# Controlled repair trigger v3
