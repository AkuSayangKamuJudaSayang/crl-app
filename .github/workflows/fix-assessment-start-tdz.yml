name: Fix assessment start TDZ

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix assessment start ReferenceError' && github.event.head_commit.message != 'Remove temporary assessment start TDZ repair'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Apply repair
        run: python3 scripts/fix-assessment-start-tdz.py
      - name: Verify repair
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/teacher/assessment/AssessmentClient.jsx').read_text(encoding='utf-8')
          pos_ref = text.index('const latestSessionRef =')
          pos_current = text.index('const currentQuestions = getComprehensionQuestions(latestSessionRef.current || session)')
          assert pos_ref < pos_current, 'latestSessionRef must be initialized before currentQuestions'
          assert 'const questionIndexRef = useRef(0);' in text
          assert 'const [\n    questionIndex,' in text
          assert 'const latestActiveStageRef =\n    useRef(activeStage);' in text
          PY
      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run build
      - name: Commit verified repair
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Fix assessment start ReferenceError
          file_pattern: app/teacher/assessment/AssessmentClient.jsx
      - name: Remove temporary repair files
        run: |
          rm -f scripts/fix-assessment-start-tdz.py .github/workflows/fix-assessment-start-tdz.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove temporary assessment start TDZ repair'
          git push
