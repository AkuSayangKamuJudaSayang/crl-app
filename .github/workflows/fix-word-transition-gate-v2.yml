name: Repair word transition loading gate v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'AkuSayangKamuJudaSayang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply robust transition gate patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # Learner loading overlay + readiness signal.
          p = Path('app/learner/LearnerAssessmentPage.jsx')
          text = p.read_text(encoding='utf-8')
          text = once(
              text,
              'import { getAssessmentState, saveAssessmentState } from "../../lib/assessmentOutbox";\nimport {\n  createAssessmentChannel,\n  closeAssessmentChannel,\n  createAssessmentRealtimeChannel,\n} from "../../lib/assessmentChannel";',
              'import { getAssessmentState, saveAssessmentState } from "../../lib/assessmentOutbox";\nimport {\n  createAssessmentChannel,\n  closeAssessmentChannel,\n  createAssessmentRealtimeChannel,\n  publishLearnerPreparationReady,\n} from "../../lib/assessmentChannel";',
              'learner readiness import'
          )

          text = once(
              text,
              '''  const triggerWordPreparation = useCallback(() => {\n    if (preparationTimerRef.current) window.clearTimeout(preparationTimerRef.current);\n    setShowPreparationOverlay(true);\n    preparationTimerRef.current = window.setTimeout(() => {\n      preparationTimerRef.current = null;\n      setShowPreparationOverlay(false);\n    }, 2000);\n  }, []);''',
              '''  const triggerWordPreparation = useCallback(() => {\n    if (preparationTimerRef.current) {\n      window.clearTimeout(preparationTimerRef.current);\n    }\n\n    setShowPreparationOverlay(true);\n\n    preparationTimerRef.current = window.setTimeout(() => {\n      preparationTimerRef.current = null;\n      setShowPreparationOverlay(false);\n\n      const learnerCode = String(localSessionKeyRef.current || "")\n        .replace(/^learner:/i, "")\n        .trim();\n\n      if (learnerCode) {\n        void publishLearnerPreparationReady(learnerCode, sessionRef.current);\n      }\n    }, 2000);\n  }, []);''',
              'learner preparation completion'
          )

          text = once(
              text,
              '''      {showPreparationOverlay && !completed && !ended && (\n        <div className="overlay" role="status" aria-live="polite" aria-label="Preparing word assessment">\n          <div className="overlay-card preparation-card">\n            <div className="preparation-spinner" aria-hidden="true" />\n          </div>\n        </div>\n      )}''',
              '''      {showPreparationOverlay && !completed && !ended && (\n        <div className="word-preparation-overlay" role="status" aria-live="assertive" aria-label="Moving to the next level">\n          <div className="word-preparation-card">\n            <div className="preparation-spinner" aria-hidden="true" />\n            <h2 className="word-preparation-title">Moving to the next level...</h2>\n            <p className="word-preparation-text">Get ready for word recognition.</p>\n          </div>\n        </div>\n      )}''',
              'learner opaque preparation overlay'
          )

          style_anchor = '''        .preparation-card {\n          width: 86px !important;\n          height: 86px;\n          padding: 0 !important;\n          display: grid;\n          place-items: center;\n          border-radius: 20px !important;\n        }'''
          prep_styles = '''        .word-preparation-overlay {\n          position: fixed;\n          inset: 0;\n          z-index: 7000;\n          display: flex;\n          align-items: center;\n          justify-content: center;\n          padding: 18px;\n          background: #f2f7fc;\n          backdrop-filter: none;\n          -webkit-backdrop-filter: none;\n          animation: overlayFade .16s ease-out;\n        }\n\n        .word-preparation-card {\n          width: min(460px, 92vw);\n          padding: 30px 26px;\n          border: 1px solid #d3e0eb;\n          border-radius: 22px;\n          background: linear-gradient(145deg,#f8fbff,#eaf3fa);\n          box-shadow: 12px 14px 30px rgba(154,174,195,.32), -8px -8px 18px rgba(255,255,255,.90);\n          text-align: center;\n          color: #203951;\n        }\n\n        .word-preparation-title {\n          margin: 16px 0 0;\n          color: #183e60;\n          font-size: clamp(22px, 5vw, 30px);\n          line-height: 1.25;\n          font-weight: 950;\n        }\n\n        .word-preparation-text {\n          margin: 8px 0 0;\n          color: #71869a;\n          font-size: 14px;\n          line-height: 1.55;\n          font-weight: 750;\n        }'''
          text = once(text, style_anchor, style_anchor + '\n\n' + prep_styles, 'learner preparation styles')
          p.write_text(text, encoding='utf-8')

          # Shared realtime readiness publisher.
          p = Path('lib/assessmentChannel.js')
          text = p.read_text(encoding='utf-8')
          if 'publishLearnerPreparationReady' not in text:
              text += '''\n\nconst learnerPreparationPublisherChannels = new Map();\n\nexport async function publishLearnerPreparationReady(code, session = null) {\n  const client = await getSupabaseClient();\n  if (!client || !code) return false;\n\n  const normalizedCode = String(code).toUpperCase();\n  let channel = learnerPreparationPublisherChannels.get(normalizedCode);\n\n  if (!channel) {\n    channel = client.channel(getRealtimeTopic(normalizedCode), {\n      config: { broadcast: { self: false } },\n    });\n\n    const subscribed = await new Promise((resolve) => {\n      let settled = false;\n      const finish = (value) => {\n        if (settled) return;\n        settled = true;\n        resolve(value);\n      };\n      channel.subscribe((status) => {\n        if (status === "SUBSCRIBED") finish(true);\n        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") finish(false);\n      });\n      window.setTimeout(() => finish(false), 5000);\n    });\n\n    if (!subscribed) {\n      try { await client.removeChannel(channel); } catch {}\n      return false;\n    }\n\n    learnerPreparationPublisherChannels.set(normalizedCode, channel);\n  }\n\n  const { error } = await channel.send({\n    type: "broadcast",\n    event: "assessment_state",\n    payload: {\n      version: Date.now(),\n      source: "learner",\n      event: "word_preparation_ready",\n      code: normalizedCode,\n      stage: session?.stage || "word",\n      item_index: 0,\n    },\n  });\n\n  return !error;\n}\n'''
              p.write_text(text, encoding='utf-8')

          # Teacher gate.
          p = Path('app/teacher/assessment/AssessmentClient.jsx')
          text = p.read_text(encoding='utf-8')

          state_anchor = '''  const [\n    transitionPending,\n    setTransitionPending,\n  ] = useState(false);\n\n  const miscueWriteChainsRef ='''
          state_new = '''  const [\n    transitionPending,\n    setTransitionPending,\n  ] = useState(false);\n\n  const [\n    wordPreparationPending,\n    setWordPreparationPending,\n  ] = useState(false);\n\n  const wordPreparationTimerRef = useRef(null);\n\n  const startWordPreparationGate = useCallback(() => {\n    if (wordPreparationTimerRef.current) {\n      window.clearTimeout(wordPreparationTimerRef.current);\n    }\n    setWordPreparationPending(true);\n    wordPreparationTimerRef.current = window.setTimeout(() => {\n      wordPreparationTimerRef.current = null;\n      setWordPreparationPending(false);\n    }, 4000);\n  }, []);\n\n  const miscueWriteChainsRef ='''
          text = once(text, state_anchor, state_new, 'teacher gate state')

          fetch_anchor = '''            if (serverStage === "word") {\n              const serverIndex =\n                WORDS.indexOf(serverContent);\n\n              if (serverIndex >= 0) {\n                setWordIndex(serverIndex);\n              }\n            }'''
          fetch_new = '''            if (serverStage === "word") {\n              const serverIndex =\n                WORDS.indexOf(serverContent);\n\n              if (serverIndex >= 0) {\n                if (currentStage === "letter" && serverIndex === 0) {\n                  startWordPreparationGate();\n                }\n                setWordIndex(serverIndex);\n              }\n            }'''
          text = once(text, fetch_anchor, fetch_new, 'teacher polling gate')

          response_anchor = '''        if (data.session) {\n          setSession(data.session);\n          setActiveStage(data.session.stage);\n        }\n\n        setTransitionPending(false);'''
          response_new = '''        if (data.session) {\n          const nextStage = String(data.session.stage || "");\n          const nextContent = String(\n            data.session.current_content ??\n              data.session.currentContent ??\n              ""\n          );\n\n          if (\n            latestActiveStageRef.current === "letter" &&\n            nextStage === "word" &&\n            WORDS.indexOf(nextContent) === 0\n          ) {\n            startWordPreparationGate();\n          }\n\n          setSession(data.session);\n          setActiveStage(data.session.stage);\n        }\n\n        setTransitionPending(false);'''
          response_count = text.count(response_anchor)
          if response_count != 2:
              raise SystemExit(f'teacher response transition anchors expected 2, found {response_count}')
          text = text.replace(response_anchor, response_new)

          word_button_disabled = '''                        disabled={\n                          busy ||\n                          transitionPending ||\n                          answerLockKey ===\n                            ("word:" +\n                              wordIndex)\n                        }'''
          word_button_disabled_new = '''                        disabled={\n                          busy ||\n                          transitionPending ||\n                          wordPreparationPending ||\n                          answerLockKey ===\n                            ("word:" +\n                              wordIndex)\n                        }'''
          button_count = text.count(word_button_disabled)
          if button_count != 2:
              raise SystemExit(f'word answer button disabled anchors expected 2, found {button_count}')
          text = text.replace(word_button_disabled, word_button_disabled_new)

          realtime_anchor = '''      (message) => {\n        if (\n          cancelled ||\n          !message ||\n          message.source !== "teacher" ||\n          !message.session\n        ) {\n          return;\n        }\n\n        applyIncomingSession(\n          {\n            ...message.session,\n            __realtimeVersion: message.version,\n          },\n          "broadcast"\n        );\n      }'''
          realtime_new = '''      (message) => {\n        if (cancelled || !message) return;\n\n        if (\n          message.source === "learner" &&\n          message.event === "word_preparation_ready" &&\n          Number(message.item_index) === 0\n        ) {\n          setWordPreparationPending(false);\n          if (wordPreparationTimerRef.current) {\n            window.clearTimeout(wordPreparationTimerRef.current);\n            wordPreparationTimerRef.current = null;\n          }\n          return;\n        }\n\n        if (message.source !== "teacher" || !message.session) return;\n\n        applyIncomingSession(\n          {\n            ...message.session,\n            __realtimeVersion: message.version,\n          },\n          "broadcast"\n        );\n      }'''
          text = once(text, realtime_anchor, realtime_new, 'teacher readiness subscriber')

          cleanup_anchor = '''      if (\n        networkProbeTimerRef.current\n      ) {'''
          cleanup_new = '''      if (wordPreparationTimerRef.current) {\n        window.clearTimeout(wordPreparationTimerRef.current);\n        wordPreparationTimerRef.current = null;\n      }\n\n      if (\n        networkProbeTimerRef.current\n      ) {'''
          text = once(text, cleanup_anchor, cleanup_new, 'teacher gate cleanup')
          p.write_text(text, encoding='utf-8')
          print('Source patch applied.')
          PY

      - name: Verify source invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          learner = Path('app/learner/LearnerAssessmentPage.jsx').read_text(encoding='utf-8')
          teacher = Path('app/teacher/assessment/AssessmentClient.jsx').read_text(encoding='utf-8')
          channel = Path('lib/assessmentChannel.js').read_text(encoding='utf-8')
          checks = [
              ('learner opaque overlay', 'word-preparation-overlay' in learner and 'background: #f2f7fc' in learner),
              ('learner loading text', 'Moving to the next level...' in learner),
              ('learner readiness signal', 'publishLearnerPreparationReady' in learner and 'word_preparation_ready' in channel),
              ('teacher preparation state', 'wordPreparationPending' in teacher),
              ('teacher both answer buttons gated', teacher.count('wordPreparationPending ||') == 2),
              ('teacher readiness unlock', 'message.event === "word_preparation_ready"' in teacher),
              ('teacher polling first-word gate', 'currentStage === "letter" && serverIndex === 0' in teacher),
          ]
          for name, ok in checks:
              print(f'{name}: {"PASS" if ok else "FAIL"}')
              if not ok: raise SystemExit(name)
          PY
          git diff --check

      - name: Install and build
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build

      - name: Commit verified changes and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/learner/LearnerAssessmentPage.jsx app/teacher/assessment/AssessmentClient.jsx lib/assessmentChannel.js .github/workflows/fix-word-transition-gate.yml .github/workflows/fix-word-transition-gate-v2.yml scripts/transition-gate-trigger.txt
          git commit -m 'Fix learner word transition loading gate'
          git rm .github/workflows/fix-word-transition-gate.yml .github/workflows/fix-word-transition-gate-v2.yml scripts/transition-gate-trigger.txt
          git commit -m 'Remove temporary word transition gate tooling'
          git push origin main
