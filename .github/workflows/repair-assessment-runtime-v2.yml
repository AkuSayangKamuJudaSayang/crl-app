name: Repair assessment runtime v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair assessment runtime v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Apply CRLA marking display correction
        run: python3 scripts/fix_crla_markings.py
      - name: Validate source
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'const STORY_QUESTIONS = {' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'What is the job of Dulnuwan?' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'Reversion' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'relatedWordIndex' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'reversionOrder' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'textDecoration: "underline double' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'annotation && (markerGlyph ||' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'crlComprehensionAnswerButton' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'setTransitionPending(true)' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'What is the job of Dulnuwan?' app/learner/LearnerAssessmentPage.jsx
          grep -q 'getComprehensionQuestions(session)' app/learner/LearnerAssessmentPage.jsx
      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run build
      - name: Commit verified repair
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Repair assessment runtime v2
