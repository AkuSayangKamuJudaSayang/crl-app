name: Repair assessment runtime v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair assessment runtime v2' && github.event.head_commit.message != 'Add field comprehension questions and CRLA miscue markings'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Validate CRLA repair runner
        run: python3 -m py_compile scripts/field_miscuerepair.py
      - name: Apply CRLA field questions and miscue markings
        run: python3 scripts/field_miscuerepair.py
      - name: Validate source
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'What is the job of Dulnuwan?' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'When do Ali and Dina help Dulnuwan and Bugan?' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'Where do they rest?' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'Why do they rest?' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'What kind of weather or day is it?' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'What does Dulnuwan pick up?' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'Reversion' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'relatedWordIndex' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'reversionOrder' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'underline double' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'getComprehensionQuestions(session)' app/learner/LearnerAssessmentPage.jsx
          grep -q 'setTransitionPending(true)' app/teacher/assessment/AssessmentClient.jsx
          grep -q 'crlComprehensionAnswerButton' app/teacher/assessment/AssessmentClient.jsx
      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run build
      - name: Commit verified repair
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Add field comprehension questions and CRLA miscue markings
